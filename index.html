        function HarmReductionTracker() {

            // ALTERAÇÃO 5: Sistema de ciclos para controlar mudança de frase/reflexão

            useEffect(() => { const saved = localStorage.getItem('darkMode') === 'true'; setDarkMode(saved); if (saved) document.body.classList.add('dark'); }, []);

            useEffect(() => { waitForFirebase().then(() => { const { initializeApp, getFirestore, getAuth, enableIndexedDbPersistence } = window.firebaseModules; const app = initializeApp(firebaseConfig); const dbInstance = getFirestore(app); const authInstance = getAuth(app); enableIndexedDbPersistence(dbInstance).catch(() => {}); setDb(dbInstance); setAuth(authInstance); setFirebaseInitialized(true); }); }, []);

            useEffect(() => { if (!auth) return; const { onAuthStateChanged } = window.firebaseModules; onAuthStateChanged(auth, (user) => { setUser(user); }); }, [auth]);

            useEffect(() => { if (!user || !db) return; const { collection, onSnapshot } = window.firebaseModules; const unsubs = [onSnapshot(collection(db, `users/${user.uid}/consumptions`), snap => setConsumptions(snap.docs.map(d => d.data()).sort((a,b) => b.timestamp.localeCompare(a.timestamp)))), onSnapshot(collection(db, `users/${user.uid}/dailyLogs`), snap => setDailyLogs(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/wellbeingLogs`), snap => setWellbeingLogs(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/reflections`), snap => setReflections(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/cycles`), snap => setCycles(snap.docs.map(d => d.data()).sort((a,b) => b.timestamp.localeCompare(a.timestamp)))), onSnapshot(collection(db, `users/${user.uid}/goals`), snap => setGoals(snap.docs.map(d => d.data())))]; return () => unsubs.forEach(u => u()); }, [user, db]);

            const toggleDarkMode = () => { const newMode = !darkMode; setDarkMode(newMode); localStorage.setItem('darkMode', newMode); document.body.classList.toggle('dark', newMode); };

            const handleAuth = async (e) => { e.preventDefault(); setAuthError(''); if (!auth) return; const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseModules; try { if (isLogin) await signInWithEmailAndPassword(auth, email, password); else await createUserWithEmailAndPassword(auth, email, password); } catch (error) { if (error.code === 'auth/user-not-found') setAuthError('Email não encontrado. Cria conta primeiro.'); else if (error.code === 'auth/wrong-password') setAuthError('Password errada.'); else if (error.code === 'auth/email-already-in-use') setAuthError('Email já existe. Faz login.'); else if (error.code === 'auth/weak-password') setAuthError('Password fraca (mínimo 6 caracteres).'); else if (error.code === 'auth/invalid-email') setAuthError('Email inválido.'); else if (error.code === 'auth/invalid-credential') setAuthError('Email ou password incorretos.'); else setAuthError('Erro: ' + error.message); } };

            const handleLogout = () => { const { signOut } = window.firebaseModules; signOut(auth); };

            const saveToFirebase = async (collectionName, entry) => { if (!user || !db) return; const { doc, setDoc, collection } = window.firebaseModules; await setDoc(doc(db, `users/${user.uid}/${collectionName}`, entry.id), entry); };

            const markConsumption = async () => { const now = new Date(); const item = { id: genId(), timestamp: now.toISOString(), date: getTodayKey(), notes: '' }; setConsumptions(prev => [item, ...prev]); await saveToFirebase('consumptions', item); };

            const deleteItem = async (collectionName, id) => { if (!user || !db) return; const { doc, deleteDoc } = window.firebaseModules; try { await deleteDoc(doc(db, `users/${user.uid}/${collectionName}`, id)); } catch (error) { console.error('Erro ao apagar:', error); } };

            const openEditConsumption = (consumption) => { setEditingConsumption({...consumption}); setShowEditConsumptionModal(true); };

            const saveEditedConsumption = async () => { if (!editingConsumption || !user || !db) return; const { doc, setDoc } = window.firebaseModules; try { await setDoc(doc(db, `users/${user.uid}/consumptions`, editingConsumption.id), editingConsumption); setConsumptions(prev => prev.map(c => c.id === editingConsumption.id ? editingConsumption : c)); setShowEditConsumptionModal(false); setEditingConsumption(null); } catch (error) { console.error('Erro ao editar:', error); } };

            const getCurrentCycleId = () => {
                if (cycles.length === 0) return null;
                return cycles[0].id; // Most recent cycle (sorted by timestamp desc)

            const submitDailyLog = async () => {

            const submitGoal = async () => {
                const target = goalForm.type.includes('delay') || goalForm.type.includes('limit') ? goalForm.target : parseFloat(goalForm.target);
                const item = { id: genId(), type: goalForm.type, target, deadline: goalForm.deadline, createdAt: new Date().toISOString(), completed: false };
                setGoals(prev => [...prev, item]);
                await saveToFirebase('goals', item);
                setGoalForm({ type: 'reduce_frequency', target: '', deadline: '' });
                setShowGoalModal(false);
            };

            // ALTERAÇÃO 1: Média de intervalos (últimos 20 consumos)
            const getIntervalStats = () => {
                if (consumptions.length < 2) return null;
                const sorted = [...consumptions].sort((a,b) => a.timestamp.localeCompare(b.timestamp));
                const last20 = sorted.slice(-20);
                const intervals = [];
                for (let i = 1; i < last20.length; i++) {
                    const diff = (new Date(last20[i].timestamp) - new Date(last20[i-1].timestamp)) / (1000 * 60 * 60);
                    intervals.push({ hours: diff, date: last20[i].date, timestamp: last20[i].timestamp });
                }
                const avgHours = intervals.reduce((sum, i) => sum + i.hours, 0) / intervals.length;
                const shortIntervals = intervals.filter(i => i.hours < 2);
                const shortByDay = {};
                shortIntervals.forEach(i => { shortByDay[i.date] = (shortByDay[i.date] || 0) + 1; });
                return { avgHours: avgHours.toFixed(1), intervals: intervals.slice(-10).reverse(), shortIntervals: shortIntervals.length, shortByDay };
            };

            const getLastInterval = () => {
                if (consumptions.length < 2) return null;
                const sorted = [...consumptions].sort((a,b) => b.timestamp.localeCompare(a.timestamp));
                const last = new Date(sorted[0].timestamp);
                const secondLast = new Date(sorted[1].timestamp);
                const diffMs = last - secondLast;
                const hours = diffMs / (1000 * 60 * 60);
                return { hours: hours.toFixed(1), isShort: hours < 2 };
            };

            const getTimeSinceLastConsumption = () => {
                if (consumptions.length === 0) return null;
                const sorted = [...consumptions].sort((a,b) => b.timestamp.localeCompare(a.timestamp));
                const last = new Date(sorted[0].timestamp);
                const now = new Date();
                const diffMs = now - last;
                const hours = diffMs / (1000 * 60 * 60);

                if (hours < 1) {
                    const minutes = Math.floor((diffMs / (1000 * 60)));
                    return { value: minutes, unit: 'min', hours: hours };
                } else if (hours < 24) {
                    return { value: hours.toFixed(1), unit: 'h', hours: hours };
                } else {
                    const days = Math.floor(hours / 24);
                    const remainingHours = Math.floor(hours % 24);
                    return { value: days, unit: days === 1 ? 'dia' : 'dias', subValue: remainingHours, subUnit: 'h', hours: hours };
                }
            };

            const getTodayConsumptions = () => consumptions.filter(c => c.date === getTodayKey());

            const getDateRangeForPeriod = (period, offset = 0) => {
                const now = new Date();
                now.setHours(23, 59, 59, 999); // End of today
                let start, end;

                if (period === 'hoje') {
                    // Today
                    end = new Date(now);
                    end.setDate(end.getDate() - offset);
                    start = new Date(end);
                    start.setHours(0, 0, 0, 0);
                } else if (period === 'semana') {
                    // Week (last 7 days)
                    end = new Date(now);
                    end.setDate(end.getDate() - (offset * 7));
                    start = new Date(end);
                    start.setDate(start.getDate() - 6);
                    start.setHours(0, 0, 0, 0);
                } else if (period === 'mes') {
                    // Month (last 30 days)
                    end = new Date(now);
                    end.setDate(end.getDate() - (offset * 30));
                    start = new Date(end);
                    start.setDate(start.getDate() - 29);
                    start.setHours(0, 0, 0, 0);
                } else {
                    // tudo (all time)
                    return { start: null, end: null };
                }

                return { start, end };
            };

            const filterByDateRange = (items, dateRange, dateField = 'timestamp') => {
                if (!dateRange.start || !dateRange.end) return items;
                return items.filter(item => {
                    const itemDate = new Date(item[dateField]);
                    return itemDate >= dateRange.start && itemDate <= dateRange.end;
                });
            };

            const getPeriodLabel = (period, offset) => {
                if (offset === 0) {
                    if (period === 'hoje') return 'Hoje';
                    if (period === 'semana') return 'Últimos 7 dias';
                    if (period === 'mes') return 'Últimos 30 dias';
                    return 'Todo o período';
                }

                if (period === 'hoje') {
                    const date = new Date();
                    date.setDate(date.getDate() - offset);
                    return date.toLocaleDateString('pt-PT', { day: 'numeric', month: 'short' });
                }
                if (period === 'semana') return `${offset} ${offset === 1 ? 'semana' : 'semanas'} atrás`;
                if (period === 'mes') return `${offset} ${offset === 1 ? 'mês' : 'meses'} atrás`;
                return 'Todo o período';
            };

            const getLast7Days = () => { const logs = dailyLogs.slice(0, 7); if (logs.length === 0) return { avgTimes: 0, avgMg: 0 }; return { avgTimes: (logs.reduce((sum, l) => sum + l.times, 0) / logs.length).toFixed(1), avgMg: (logs.reduce((sum, l) => sum + l.mg, 0) / logs.length).toFixed(0) }; };

            const exportToCSV = () => { const headers = ['Data', 'Hora', 'Tipo', 'Detalhes']; const rows = [...consumptions.map(c => [new Date(c.timestamp).toLocaleDateString('pt-PT'), new Date(c.timestamp).toLocaleTimeString('pt-PT'), 'Consumo', c.notes || '']), ...dailyLogs.map(l => [l.date, '', 'Dosagem', l.times + 'x, ' + l.mg + 'mg' + (l.notes ? ', ' + l.notes : '')]), ...wellbeingLogs.map(w => [w.date, '', 'Bem-estar', 'Sono: ' + w.sleep + '/10, Humor: ' + w.mood + '/10'])]; const csv = [headers, ...rows].map(row => row.map(cell => '"' + cell + '"').join(',')).join('\n'); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'reducao-danos-' + getTodayKey() + '.csv'; a.click(); };

            // ALTERAÇÃO 2 e 7: Corrigir progresso de metas + adicionar meta "hora do último consumo"
            const getGoalProgress = (goal) => {
                if (goal.type === 'reduce_frequency') {
                    const avgLast7 = parseFloat(getLast7Days().avgTimes);
                    if (avgLast7 === 0) return 0;
                    if (avgLast7 <= goal.target) return 100;
                    const baseline = Math.max(avgLast7, goal.target * 2);
                    const progress = ((baseline - avgLast7) / (baseline - goal.target)) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                if (goal.type === 'reduce_quantity') {
                    const avgLast7Mg = parseFloat(getLast7Days().avgMg);
                    if (avgLast7Mg === 0) return 0;
                    if (avgLast7Mg <= goal.target) return 100;
                    const baseline = Math.max(avgLast7Mg, goal.target * 2);
                    const progress = ((baseline - avgLast7Mg) / (baseline - goal.target)) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                if (goal.type === 'delay_first') {
                    const recentConsumptions = consumptions.slice(0, 21);
                    if (recentConsumptions.length === 0) return 0;
                    const firstOfDays = {};
                    recentConsumptions.forEach(c => { if (!firstOfDays[c.date] || c.timestamp < firstOfDays[c.date]) { firstOfDays[c.date] = c.timestamp; } });
                    const targetParts = goal.target.split(':');
                    const targetMinutes = parseInt(targetParts[0]) * 60 + parseInt(targetParts[1]);
                    let successDays = 0;
                    Object.values(firstOfDays).forEach(timestamp => { const d = new Date(timestamp); const firstMinutes = d.getHours() * 60 + d.getMinutes(); if (firstMinutes >= targetMinutes) successDays++; });
                    return Math.min(100, (successDays / Object.keys(firstOfDays).length) * 100);
                }
                
                if (goal.type === 'increase_interval') {
                    const intervalStats = getIntervalStats();
                    if (!intervalStats) return 0;
                    const avg = parseFloat(intervalStats.avgHours);
                    if (avg >= goal.target) return 100;
                    const progress = (avg / goal.target) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                // ALTERAÇÃO 7: Nova meta "Hora do último consumo diário"
                if (goal.type === 'limit_last') {
                    const recentConsumptions = consumptions.slice(0, 21);
                    if (recentConsumptions.length === 0) return 0;
                    const lastOfDays = {};
                    recentConsumptions.forEach(c => { if (!lastOfDays[c.date] || c.timestamp > lastOfDays[c.date]) { lastOfDays[c.date] = c.timestamp; } });
                    const targetParts = goal.target.split(':');
                    const targetMinutes = parseInt(targetParts[0]) * 60 + parseInt(targetParts[1]);
                    let successDays = 0;
                    Object.values(lastOfDays).forEach(timestamp => { const d = new Date(timestamp); const lastMinutes = d.getHours() * 60 + d.getMinutes(); if (lastMinutes <= targetMinutes) successDays++; });
                    return Math.min(100, (successDays / Object.keys(lastOfDays).length) * 100);
                }
                
                return 0;
            };

            // Streak calculation
            const getStreaks = () => {
                if (consumptions.length === 0 && wellbeingLogs.length === 0) return { current: 0, max: 0 };

                const allDates = [...new Set([...consumptions.map(c => c.date), ...wellbeingLogs.map(w => w.date)])].sort();
                const today = getTodayKey();

                let currentStreak = 0;
                let maxStreak = 1;
                let streak = 1;

                // Calculate max streak
                for (let i = 1; i < allDates.length; i++) {
                    const prev = new Date(allDates[i-1]);
                    const curr = new Date(allDates[i]);
                    const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
                    if (diffDays === 1) {
                        streak++;
                        maxStreak = Math.max(maxStreak, streak);
                    } else {
                        streak = 1;
                    }
                }

                // Calculate current streak (working backwards from today)
                if (allDates.includes(today)) {
                    currentStreak = 1;
                    let checkDate = new Date(today);
                    for (let i = allDates.length - 2; i >= 0; i--) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        const checkKey = checkDate.toISOString().split('T')[0];
                        if (allDates[i] === checkKey) {
                            currentStreak++;
                        } else {
                            break;
                        }
                    }
                }

                return { current: currentStreak, max: maxStreak };
            };

            // Badge/Achievement system
            const getBadges = () => {

                if (consumptions.length >= 2) {

                    for (let i = 1; i < sorted.length; i++) {

                        if (diff >= 2) {

                if (cycles.length >= 5) badges.push({ id: 'cycles_5', title: 'Rastreador Dedicado', description: cycles.length + ' ciclos marcados', icon: '🌙', color: 'indigo' });

                // Goal completion badge
                const completedGoals = goals.filter(g => getGoalProgress(g) >= 100);
                if (completedGoals.length >= 1) badges.push({ id: 'goal_1', title: 'Meta Atingida', description: completedGoals.length + ' meta(s) completa(s)', icon: '🎯', color: 'pink' });

                // Reduction badge (compare first week vs last week)
                if (consumptions.length > 0) {
                    const dates = [...new Set(consumptions.map(c => c.date))].sort();
                    if (dates.length >= 14) {
                        const firstWeekDates = dates.slice(0, 7);
                        const lastWeekDates = dates.slice(-7);
                        const firstWeekCount = consumptions.filter(c => firstWeekDates.includes(c.date)).length;

                            badges.push({ id: 'reduction', title: 'Redução de Consumo', description: 'Reduziste ' + (firstWeekCount - lastWeekCount) + ' consumos vs primeira semana', icon: '📉', color: 'green' });

                    }
                }

                // Consistency badge (tracked for 7 days in a row)
                if (consumptions.length > 0 || wellbeingLogs.length > 0) {
                    const allDates = [...new Set([...consumptions.map(c => c.date), ...wellbeingLogs.map(w => w.date)])].sort();
                    let streak = 1;
                    let maxStreak = 1;
                    for (let i = 1; i < allDates.length; i++) {
                        const prev = new Date(allDates[i-1]);
                        const curr = new Date(allDates[i]);
                        const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
                        if (diffDays === 1) {
                            streak++;
                            maxStreak = Math.max(maxStreak, streak);
                        } else {
                            streak = 1;
                        }
                    }
                    if (maxStreak >= 7) badges.push({ id: 'streak_7', title: '7 Dias Consecutivos', description: 'Maior sequência: ' + maxStreak + ' dias', icon: '🔥', color: 'orange' });
                    if (maxStreak >= 14) badges.push({ id: 'streak_14', title: '14 Dias Consecutivos', description: 'Maior sequência: ' + maxStreak + ' dias', icon: '🔥', color: 'orange' });
                    if (maxStreak >= 30) badges.push({ id: 'streak_30', title: '30 Dias Consecutivos', description: 'Maior sequência: ' + maxStreak + ' dias', icon: '💪', color: 'orange' });
                }

                // Self-care champion (checked all 4 items at least once)
                const hasAllSelfCare = wellbeingLogs.some(w => w.water && w.rest && w.social && w.food);
                if (hasAllSelfCare) badges.push({ id: 'selfcare_complete', title: 'Autocuidado Completo', description: 'Completaste todos os itens de autocuidado', icon: '✨', color: 'yellow' });

                return badges;
            };

            const intervalStats = getIntervalStats();
            const todayCount = getTodayConsumptions().length;
            const last7 = getLast7Days();
            const streaks = getStreaks();
            const badges = getBadges();

            // Coping strategies based on triggers
            const getCopingStrategies = () => {

                const triggerCount = {};
                allTriggers.forEach(t => { triggerCount[t] = (triggerCount[t] || 0) + 1; });
                const topTriggers = Object.entries(triggerCount).sort((a,b) => b[1] - a[1]).slice(0, 3).map(([t]) => t);

                    'Stress': ['Pratica respiração profunda (4-7-8)', 'Faz uma caminhada de 10 minutos', 'Ouve música relaxante'],
                    'Ansiedade': ['Nomeia 5 coisas que vês, 4 que ouves, 3 que tocas', 'Pratica grounding: pés no chão, respira fundo', 'Escreve os teus pensamentos num papel'],

                if (topTriggers.length === 0) {

                    ];
                }

                const selectedStrategies = [];
                topTriggers.forEach(trigger => {
                    if (strategies[trigger]) {

                return selectedStrategies.length > 0 ? selectedStrategies : strategies['Stress'];
            };

            const copingStrategies = getCopingStrategies();

            // Positive daily feedback
            const getPositiveFeedback = () => {
                const messages = [];

                // Check streak
                if (streaks.current >= 7) messages.push(`🔥 Incrível! ${streaks.current} dias consecutivos de registo!`);

                if (wellbeingLogs.length > 0) {

                    if (completedItems >= 3) messages.push(`💚 Autocuidado em dia! ${completedItems}/4 itens`);

                // Check reduction trend
                if (dailyLogs.length >= 2) {
                    const last = dailyLogs[0];

                // Default positive messages
                if (messages.length === 0) {
                    const defaults = [
                        '🌟 Cada registo é um passo importante',
                        '💜 Estás a cuidar de ti. Isso é o que importa',
                        '🌱 O progresso não é linear, e está tudo bem',

                    ];
                    messages.push(defaults[Math.floor(Math.random() * defaults.length)]);
                }

                return messages[0];
            };

            const positiveFeedback = getPositiveFeedback();

            // Render
            if (!firebaseInitialized) return (<div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center p-4"><div className="text-purple-600 text-xl">A carregar... 🔄</div></div>);

            // ALTERAÇÃO 3: Título do login "NEP app"
            if (!user) return (<div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center p-4"><div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full"><h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-2">NEP app</h1><p className="text-gray-600 mb-6">Sincroniza entre dispositivos 💜</p><form onSubmit={handleAuth} className="space-y-4"><input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required /><input type="password" placeholder="Password (mínimo 6 caracteres)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />{authError && (<div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm">{authError}</div>)}<button type="submit" className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all font-medium">{isLogin ? 'Entrar' : 'Criar Conta'}</button><button type="button" onClick={() => setIsLogin(!isLogin)} className="w-full text-purple-600 text-sm hover:underline">{isLogin ? 'Criar conta nova' : 'Já tenho conta'}</button></form><p className="text-xs text-gray-500 mt-6">💡 Usa o mesmo email e password no PC e telemóvel para sincronizar</p></div></div>);

            return (
                <div className={'min-h-screen ' + (darkMode ? 'dark bg-gray-900' : 'bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50') + ' p-4 transition-colors pb-24'}>
                    <div className="max-w-2xl mx-auto">

                                    <div className="flex items-start justify-between">

                                                <span className="font-bold text-black">N</span><span className="text-gray-700">otas de </span>

                                                <span className="font-bold text-black">P</span><span className="text-gray-700">adrões</span>

                                    <div className="grid grid-cols-2 gap-4">

                                        <button onClick={() => setShowWellbeingModal(true)} className="bg-gradient-to-br from-blue-500 to-cyan-500 text-white rounded-xl p-4 font-medium hover:from-blue-600 hover:to-cyan-600 transition-all shadow-md hover:shadow-lg flex flex-col items-center">

                                        <div className="bg-white rounded-xl p-4 border border-gray-200"><div className="text-gray-600 text-sm mb-1">Média 7 dias</div><div className="text-3xl font-bold text-pink-600">{last7.avgTimes}x</div><div className="text-sm text-gray-500">{last7.avgMg}mg/dia</div></div>

                                                    <div className="flex flex-col">

                                            const allNotes = [

                                            ].join(' ').toLowerCase();

                                            const topWords = Object.entries(wordFreq).sort((a,b) => b[1] - a[1]).slice(0, 15);

                                                const sumY = data.reduce((sum, d) => sum + d[yKey], 0);

                                                const denominator = Math.sqrt((n * sumX2 - sumX * sumX) * (n * sumY2 - sumY * sumY));
                                                return denominator === 0 ? null : numerator / denominator;

                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2"><Clock className="w-4 h-4 text-purple-600" /> Consumos ({filteredConsumptions.length})</h3>
                                                        <div className="space-y-3">
                                                            {filteredConsumptions.map(c => (
                                                                <div key={c.id} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                                    <div className="flex justify-between items-center">
                                                                        <div>
                                                                            <div className="font-medium text-gray-800">{new Date(c.timestamp).toLocaleDateString('pt-PT')} - {new Date(c.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</div>
                                                                            {c.notes && <div className="text-sm text-gray-600 mt-1">💭 {c.notes}</div>}
                                                                        </div>
                                                                        <button onClick={() => deleteItem('consumptions', c.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-4 h-4" /></button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {filteredCycles.length > 0 && (
                                                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">🌙 Ciclos ({filteredCycles.length})</h3>
                                                        <div className="space-y-3">
                                                            {filteredCycles.map(cycle => (
                                                                <div key={cycle.id} className="p-3 bg-indigo-50 rounded-lg border border-indigo-200">
                                                                    <div className="flex justify-between items-center mb-2">
                                                                        <div className="text-sm font-medium text-gray-800">{new Date(cycle.timestamp).toLocaleDateString('pt-PT')} {new Date(cycle.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</div>
                                                                        <button onClick={() => deleteItem('cycles', cycle.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-3 h-3" /></button>
                                                                    </div>
                                                                    {cycle.bedtime && (
                                                                        <div className="text-sm text-gray-700 mb-1">
                                                                            <span className="text-gray-600">Hora de deitar: </span>
                                                                            <span className="font-medium">{cycle.bedtime}</span>
                                                                        </div>
                                                                    )}
                                                                    {cycle.triggers && cycle.triggers.length > 0 && (
                                                                        <div className="text-sm text-gray-700 mb-1">
                                                                            <span className="text-gray-600">Gatilhos: </span>
                                                                            <span className="font-medium">{cycle.triggers.join(', ')}</span>
                                                                        </div>
                                                                    )}
                                                                    {cycle.notes && <div className="text-sm text-gray-600 mt-2 italic">💭 {cycle.notes}</div>}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}
                            {currentView === 'goals' && (
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-2xl font-bold text-gray-800">Metas</h2>
                                        <button onClick={() => setShowGoalModal(true)} className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm font-medium">+ Nova Meta</button>
                                    </div>

                                    {goals.length === 0 ? (
                                        <div className="text-center py-8 text-gray-500"><Target className="w-12 h-12 mx-auto mb-3 text-gray-400" /><p>Ainda não tens metas definidas</p></div>
                                    ) : (
                                        <div className="space-y-4">
                                            {goals.map(goal => (
                                                <div key={goal.id} className="bg-white rounded-xl p-4 border border-gray-200">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <h3 className="font-semibold text-gray-800">
                                                                {goal.type === 'reduce_frequency' && 'Reduzir Frequência'}
                                                                {goal.type === 'reduce_quantity' && 'Reduzir Quantidade'}
                                                                {goal.type === 'delay_first' && 'Adiar Primeiro Consumo'}
                                                                {goal.type === 'increase_interval' && 'Aumentar Intervalo'}
                                                                {goal.type === 'limit_last' && 'Hora do Último Consumo'}
                                                            </h3>
                                                            <p className="text-sm text-gray-600">
                                                                Meta: {goal.type === 'reduce_frequency' && goal.target + 'x/dia'}
                                                                {goal.type === 'reduce_quantity' && goal.target + 'mg/dia'}
                                                                {goal.type === 'delay_first' && 'após ' + goal.target}
                                                                {goal.type === 'increase_interval' && goal.target + 'h entre consumos'}
                                                                {goal.type === 'limit_last' && 'antes de ' + goal.target}
                                                            </p>
                                                            <p className="text-sm text-gray-500">Até: {new Date(goal.deadline).toLocaleDateString('pt-PT')}</p>
                                                        </div>
                                                        <button onClick={() => deleteItem('goals', goal.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-4 h-4" /></button>
                                                    </div>
                                                    <div className="mt-3">
                                                        <div className="flex justify-between text-sm mb-1">
                                                            <span className="text-gray-600">Progresso</span>
                                                            <span className="font-medium text-purple-600">{getGoalProgress(goal).toFixed(0)}%</span>
                                                        </div>
                                                        <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                                            <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all" style={{ width: getGoalProgress(goal) + '%' }} />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentView === 'resources' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Recursos</h2>
                                    <div className="bg-red-50 rounded-xl p-6 border border-red-200"><h3 className="font-semibold text-red-800 mb-3">🚨 Emergência</h3><div className="space-y-2 text-red-700"><p><strong>INEM:</strong> 112</p><p><strong>Linha Vida:</strong> 1414</p></div></div>
                                    <div className="bg-white rounded-xl p-6 border border-gray-200"><h3 className="font-semibold text-gray-800 mb-3">📞 Linhas de Apoio</h3><div className="space-y-2 text-gray-700"><p><strong>SOS Droga:</strong> 1414 (24h)</p><p><strong>SNS 24:</strong> 808 24 24 24</p></div></div>
                                    {educationalResources.map((resource, i) => (
                                        <div key={i} className="bg-purple-50 rounded-xl p-4 border border-purple-200"><h4 className="font-medium text-purple-800 mb-2">{resource.title}</h4><p className="text-sm text-purple-700">{resource.content}</p></div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Modals */}
                        {showDailyLogModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowDailyLogModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Registar Dosagem do Dia</h3>
                                        <button onClick={() => setShowDailyLogModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Total aproximado (mg)</label>
                                            <input type="number" value={dailyForm.mg} onChange={(e) => setDailyForm({...dailyForm, mg: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" min="0" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Notas (opcional)</label>
                                            <textarea value={dailyForm.notes} onChange={(e) => setDailyForm({...dailyForm, notes: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400 h-20" placeholder="Como te sentiste? Contexto..."></textarea>
                                        </div>
                                        <button onClick={submitDailyLog} className="w-full bg-gradient-to-r from-pink-500 to-rose-500 text-white py-3 rounded-lg hover:from-pink-600 hover:to-rose-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showWellbeingModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowWellbeingModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Check-in Bem-Estar</h3>
                                        <button onClick={() => setShowWellbeingModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Horas de sono</label>
                                            <input type="number" min="0" max="24" step="0.5" value={wellbeingForm.sleep} onChange={(e) => setWellbeingForm({...wellbeingForm, sleep: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400" placeholder="Ex: 7.5" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Humor: {wellbeingForm.mood}/10</label>
                                            <input type="range" min="1" max="10" value={wellbeingForm.mood} onChange={(e) => setWellbeingForm({...wellbeingForm, mood: e.target.value})} className="w-full" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Energia: {wellbeingForm.energy}/10</label>
                                            <input type="range" min="1" max="10" value={wellbeingForm.energy} onChange={(e) => setWellbeingForm({...wellbeingForm, energy: e.target.value})} className="w-full" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Autocuidado hoje</label>
                                            <div className="space-y-2">
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.water} onChange={(e) => setWellbeingForm({...wellbeingForm, water: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className="text-sm text-gray-700">💧 Bebi água suficiente</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.rest} onChange={(e) => setWellbeingForm({...wellbeingForm, rest: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className="text-sm text-gray-700">😴 Descansei o suficiente</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.social} onChange={(e) => setWellbeingForm({...wellbeingForm, social: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className="text-sm text-gray-700">👥 Tive contacto social</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.food} onChange={(e) => setWellbeingForm({...wellbeingForm, food: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className="text-sm text-gray-700">🍽️ Comi refeições nutritivas</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Notas (opcional)</label>
                                            <textarea value={wellbeingForm.notes} onChange={(e) => setWellbeingForm({...wellbeingForm, notes: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 h-20" placeholder="Como te sentes hoje?"></textarea>
                                        </div>
                                        <button onClick={submitWellbeing} className="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white py-3 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showReflectionModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowReflectionModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Reflexão DBT</h3>
                                        <button onClick={() => setShowReflectionModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-purple-50 rounded-lg p-4 border border-purple-200">
                                            <p className="text-purple-900 font-medium">{currentDbtQuestion}</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">A tua reflexão</label>
                                            <textarea value={reflectionAnswer} onChange={(e) => setReflectionAnswer(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400 h-32" placeholder="Escreve os teus pensamentos..."></textarea>
                                        </div>
                                        <button onClick={submitReflection} className="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-indigo-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showCycleModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowCycleModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">🌙 Novo Ciclo</h3>
                                        <button onClick={() => setShowCycleModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <p className="text-sm text-gray-600">Marcar um novo ciclo muda a frase motivacional e a reflexão diária.</p>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Hora a que te deitaste</label>
                                            <input type="time" value={cycleForm.bedtime} onChange={(e) => setCycleForm({...cycleForm, bedtime: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">Gatilhos identificados</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {['Stress', 'Ansiedade', 'Solidão', 'Festa', 'Trabalho', 'Família', 'Hábito', 'Tristeza', 'Dependência'].map(trigger => (
                                                    <label key={trigger} className="flex items-center space-x-2 cursor-pointer">
                                                        <input type="checkbox" checked={cycleForm.triggers.includes(trigger)} onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setCycleForm({...cycleForm, triggers: [...cycleForm.triggers, trigger]});
                                                            } else {
                                                                setCycleForm({...cycleForm, triggers: cycleForm.triggers.filter(t => t !== trigger)});
                                                            }
                                                        }} className="rounded text-indigo-600 focus:ring-indigo-500" />
                                                        <span className="text-sm text-gray-700">{trigger}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Notas sobre este ciclo (opcional)</label>
                                            <textarea value={cycleForm.notes} onChange={(e) => setCycleForm({...cycleForm, notes: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 h-20" placeholder="Como foi o ciclo? O que observaste?"></textarea>
                                        </div>
                                        <button onClick={submitCycle} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white py-3 rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all font-medium">Iniciar Novo Ciclo</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showGoalModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowGoalModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Nova Meta</h3>
                                        <button onClick={() => setShowGoalModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Tipo de Meta</label>
                                            <select value={goalForm.type} onChange={(e) => setGoalForm({...goalForm, type: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400">
                                                <option value="reduce_frequency">Reduzir Frequência</option>
                                                <option value="reduce_quantity">Reduzir Quantidade (mg)</option>
                                                <option value="delay_first">Adiar Primeiro Consumo</option>
                                                <option value="increase_interval">Aumentar Intervalo (horas)</option>
                                                <option value="limit_last">Hora do Último Consumo</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Período</label>
                                            <select value={goalForm.period} onChange={(e) => setGoalForm({...goalForm, period: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400">
                                                <option value="daily">Diário</option>
                                                <option value="weekly">Semanal</option>
                                                <option value="monthly">Mensal</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">
                                                Meta {goalForm.type.includes('delay') || goalForm.type.includes('limit') ? '(HH:MM)' : '(número)'}
                                            </label>
                                            <input type={goalForm.type.includes('delay') || goalForm.type.includes('limit') ? 'time' : 'number'} value={goalForm.target} onChange={(e) => setGoalForm({...goalForm, target: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Prazo</label>
                                            <input type="date" value={goalForm.deadline} onChange={(e) => setGoalForm({...goalForm, deadline: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />
                                        </div>
                                        <button onClick={submitGoal} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all font-medium">Criar Meta</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showEditConsumptionModal && editingConsumption && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowEditConsumptionModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-xl font-bold text-gray-800">Editar Consumo</h3>
                                        <button onClick={() => setShowEditConsumptionModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-gray-50 p-3 rounded-lg">
                                            <div className="text-sm text-gray-600">Data e Hora</div>
                                            <div className="text-lg font-medium text-gray-800">{new Date(editingConsumption.timestamp).toLocaleDateString('pt-PT')} - {new Date(editingConsumption.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</div>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Notas</label>
                                            <textarea value={editingConsumption.notes || ''} onChange={(e) => setEditingConsumption({...editingConsumption, notes: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400 h-24" placeholder="Adiciona notas sobre este consumo..."></textarea>
                                        </div>
                                        <button onClick={saveEditedConsumption} className="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white py-3 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="fixed bottom-0 left-0 right-0 bg-white shadow-xl rounded-t-3xl p-4">
                            <div className="max-w-2xl mx-auto">
                                <div className="grid grid-cols-5 gap-1">
                                    <button onClick={() => setCurrentView('home')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'home' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <Heart className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Início</div>
                                    </button>
                                    <button onClick={() => setCurrentView('patterns')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'patterns' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <BarChart3 className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Padrões</div>
                                    </button>
                                    <button onClick={() => setCurrentView('history')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'history' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <BookOpen className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Histórico</div>
                                    </button>
                                    <button onClick={() => setCurrentView('goals')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'goals' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <Target className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Metas</div>
                                    </button>
                                    <button onClick={() => setCurrentView('resources')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'resources' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <TrendingDown className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Recursos</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HarmReductionTracker />);
    </script>
</body>
</html>
