                                                                                    text: `A meta "${goalTypeNames[goal.type]}" passou o deadline há ${daysOverdue} ${daysOverdue === 1 ? 'dia' : 'dias'}, mas estás a ${progress.toFixed(0)}% - muito perto! Estende o deadline ou faz um sprint final.`,
                                                                                    tone: 'motivation'
                                                                                });
                                                                            } else {
                                                                                coachMessages.push({
                                                                                    section: 'Reavaliação',
                                                                                    icon: '🔄',
                                                                                    text: `A meta "${goalTypeNames[goal.type]}" passou o deadline e está a ${progress.toFixed(0)}%. Sem problema! Reavalia: esta meta ainda faz sentido? Precisa de ser ajustada? O importante é aprender, não ser perfeito.`,
                                                                                    tone: 'care'
                                                                                });
                                                                            }
                                                                        }

                                                                        // SUGESTÕES ESPECÍFICAS POR TIPO DE META
                                                                        if (goal.type === 'reduce_frequency' && achievedCount < 3 && daysUntilDeadline > 0) {
                                                                            coachMessages.push({
                                                                                section: 'Dica',
                                                                                icon: '💡',
                                                                                text: `Para atingir a meta de frequência: foca em aumentar intervalos entre consumos (mínimo 2h), identifica os gatilhos principais, e substitui alguns consumos por alternativas (água, caminhada, respiração).`,
                                                                                tone: 'strategy'
                                                                            });
                                                                        }

                                                                        if (goal.type === 'delay_first' && achievedCount < 3 && daysUntilDeadline > 0) {
                                                                            coachMessages.push({
                                                                                section: 'Dica',
                                                                                icon: '💡',
                                                                                text: `Para adiar o primeiro consumo: cria uma rotina matinal (hidratação, pequeno-almoço, exercício), evita gatilhos logo ao acordar, e define um "horário de abertura" para o primeiro consumo.`,
                                                                                tone: 'strategy'
                                                                            });
                                                                        }

                                                                        if (goal.type === 'sleep_hours' && achievedCount < 3 && daysUntilDeadline > 0) {
                                                                            coachMessages.push({
                                                                                section: 'Dica',
                                                                                icon: '💡',
                                                                                text: `Para dormir mais: evita consumos 3-4h antes de dormir, cria rotina de deitar (mesma hora todos os dias), remove ecrãs 1h antes, e prepara o quarto (escuro, fresco, silencioso).`,
                                                                                tone: 'strategy'
                                                                            });
                                                                        }
                                                                    });

                                                                    // PADRÕES GERAIS
                                                                    if (activeGoals.length > 3) {
                                                                        coachMessages.push({
                                                                            section: 'Foco',
                                                                            icon: '🎯',
                                                                            text: `Tens ${activeGoals.length} metas ativas - pode ser demasiado! Foca-te em 1-2 metas de cada vez. Qualidade > Quantidade. Marca as menos importantes como completas ou ajusta os deadlines.`,
                                                                            tone: 'strategy'
                                                                        });
                                                                    }

                                                                    // Identificar tipo de meta mais difícil
                                                                    if (activeGoals.length >= 3) {
                                                                        const progressByType = {};
                                                                        activeGoals.forEach(g => {
                                                                            if (!progressByType[g.type]) progressByType[g.type] = [];
                                                                            progressByType[g.type].push(getGoalProgress(g));
                                                                        });

                                                                        const avgByType = Object.entries(progressByType).map(([type, progressArr]) => ({
                                                                            type,
                                                                            avg: progressArr.reduce((a,b) => a+b, 0) / progressArr.length,
                                                                            count: progressArr.length
                                                                        })).filter(x => x.count >= 2);

                                                                        const hardestType = avgByType.sort((a,b) => a.avg - b.avg)[0];
                                                                        if (hardestType && hardestType.avg < 40) {
                                                                            const goalTypeNames = {
                                                                                'reduce_frequency': 'reduzir frequência',
                                                                                'reduce_quantity': 'reduzir quantidade',
                                                                                'delay_first': 'adiar primeiro consumo',
                                                                                'increase_interval': 'aumentar intervalos',
                                                                                'limit_last': 'limitar último consumo',
                                                                                'sleep_hours': 'dormir mais'
                                                                            };
                                                                            coachMessages.push({
                                                                                section: 'Padrão Identificado',
                                                                                icon: '🔍',
                                                                                text: `Reparei que tens mais dificuldade em "${goalTypeNames[hardestType.type]}" (${hardestType.avg.toFixed(0)}% de progresso médio). Isto é normal! Algumas metas são mais desafiadoras. Considera pedir ajuda específica para esta área ou dividir em passos mais pequenos.`,
                                                                                tone: 'insight'
                                                                            });
                                                                        }
                                                                    }
                                                                }

                                                                // 2. ANÁLISE DE SENTIMENTO
                                                                if (sentimentAnalysis && sentimentAnalysis.totalReflections > 0) {
                                                                    const diff = sentimentAnalysis.avgSentimentLowConsumption - sentimentAnalysis.avgSentimentHighConsumption;

                                                                    if (diff > 0.5) {
                                                                        coachMessages.push({
                                                                            section: 'Descoberta',
                                                                            icon: '💡',
                                                                            text: `As tuas reflexões mostram que te sentes significativamente melhor nos dias em que consomes menos. O teu corpo e mente estão-te a dar um sinal claro: reduzir traz-te bem-estar.`,
                                                                            tone: 'insight'
                                                                        });
                                                                    } else if (sentimentAnalysis.avgSentimentHighConsumption < -0.5) {
                                                                        coachMessages.push({
                                                                            section: 'Atenção',
                                                                            icon: '💙',
                                                                            text: `Nos dias de maior consumo, as tuas palavras refletem mais sofrimento. Isto pode significar que estás a usar substâncias para lidar com dor emocional. Considera falar com alguém - não tens que lidar com isso sozinho.`,
                                                                            tone: 'care'
                                                                        });
                                                                    } else {
                                                                        coachMessages.push({
                                                                            section: 'Autoconhecimento',
                                                                            icon: '📝',
                                                                            text: `Estás a registar as tuas reflexões de forma consistente - isso já é um passo enorme no autoconhecimento. Continua a escrever, os padrões vão-se tornando mais claros com o tempo.`,
                                                                            tone: 'encouragement'
                                                                        });
                                                                    }
                                                                }

                                                                // 3. CORRELAÇÕES TEMPORAIS
                                                                if (temporalCorrelations) {
                                                                    const sleepCorr = temporalCorrelations.sleepLag1.correlation;
                                                                    const moodCorr = temporalCorrelations.moodLag1.correlation;

                                                                    if (sleepCorr !== null && sleepCorr < -0.4) {
                                                                        coachMessages.push({
                                                                            section: 'Padrão Identificado',
                                                                            icon: '😴',
                                                                            text: `Há uma correlação forte: quando dormes mal, consumis mais no dia seguinte. O sono não é luxo - é uma das tuas melhores ferramentas de redução de danos. Prioriza-o!`,
                                                                            tone: 'insight'
                                                                        });
                                                                    }

                                                                    if (moodCorr !== null && moodCorr < -0.4) {
                                                                        coachMessages.push({
                                                                            section: 'Conexão Emocional',
                                                                            icon: '🎭',
                                                                            text: `Humor baixo num dia tende a levar a mais consumo no dia seguinte. Isto é importante: identifica estratégias alternativas para dias difíceis - caminhada, respiração, ligar a alguém. Cria um plano de ação para esses momentos.`,
                                                                            tone: 'strategy'
                                                                        });
                                                                    }
                                                                }

                                                                // 3.5. IMPACTO BIDIRECIONAL (Consumo → Bem-estar)
                                                                if (bidirectionalAnalysis) {
                                                                    const sameDaySleep = bidirectionalAnalysis.sameDay.sleep.correlation;
                                                                    const nextDaySleep = bidirectionalAnalysis.nextDay.sleep.correlation;
                                                                    const sameDayMood = bidirectionalAnalysis.sameDay.mood.correlation;
                                                                    const nextDayMood = bidirectionalAnalysis.nextDay.mood.correlation;
                                                                    const sameDayEnergy = bidirectionalAnalysis.sameDay.energy.correlation;
                                                                    const nextDayEnergy = bidirectionalAnalysis.nextDay.energy.correlation;

                                                                    // Sleep impact
                                                                    if (sameDaySleep !== null && sameDaySleep < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Impacto Imediato',
                                                                            icon: '🌙',
                                                                            text: `Reparei que em dias de maior consumo, dormes significativamente menos NESSA NOITE (correlação ${sameDaySleep.toFixed(2)}). O consumo está a roubar-te sono no mesmo dia. Experimenta reduzir ou parar mais cedo.`,
                                                                            tone: 'alert'
                                                                        });
                                                                    }

                                                                    if (nextDaySleep !== null && nextDaySleep < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Impacto no Dia Seguinte',
                                                                            icon: '💤',
                                                                            text: `O consumo de hoje afeta o sono de AMANHÃ (correlação ${nextDaySleep.toFixed(2)}). É um ciclo: consumo → menos sono → mais consumo. Quebra este padrão priorizando dias de menor consumo.`,
                                                                            tone: 'insight'
                                                                        });
                                                                    }

                                                                    // Mood impact
                                                                    if (sameDayMood !== null && sameDayMood < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Efeito no Humor',
                                                                            icon: '😔',
                                                                            text: `Consumo alto piora o teu humor NO MESMO DIA (correlação ${sameDayMood.toFixed(2)}). Estás a usar para te sentires melhor, mas o efeito é o contrário. Considera alternativas mais saudáveis.`,
                                                                            tone: 'care'
                                                                        });
                                                                    }

                                                                    if (nextDayMood !== null && nextDayMood < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Ressaca Emocional',
                                                                            icon: '📉',
                                                                            text: `Dias de maior consumo resultam em humor mais baixo NO DIA SEGUINTE (correlação ${nextDayMood.toFixed(2)}). A "ressaca emocional" é real. Planeia apoio extra para o dia seguinte a consumos altos.`,
                                                                            tone: 'strategy'
                                                                        });
                                                                    }

                                                                    // Energy impact
                                                                    if (sameDayEnergy !== null && sameDayEnergy < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Energia Roubada',
                                                                            icon: '⚡',
                                                                            text: `Mais consumo = menos energia NO MESMO DIA (correlação ${sameDayEnergy.toFixed(2)}). Parece dar energia no momento, mas o saldo líquido é negativo. Os teus níveis energéticos agradecem dias de menos consumo.`,
                                                                            tone: 'insight'
                                                                        });
                                                                    }

                                                                    if (nextDayEnergy !== null && nextDayEnergy < -0.3) {
                                                                        coachMessages.push({
                                                                            section: 'Cansaço Acumulado',
                                                                            icon: '😴',
                                                                            text: `Consumo de hoje drena a energia de AMANHÃ (correlação ${nextDayEnergy.toFixed(2)}). Estás a "pedir emprestado" energia do futuro. Dias de descanso são investimento, não luxo.`,
                                                                            tone: 'alert'
                                                                        });
                                                                    }
                                                                }

                                                                // 3.6. NOVAS CORRELAÇÕES BIDIRECIONAIS (das 5 novas análises)
                                                                // Sono → Consumo
                                                                if (sleepToConsCorr !== null && sleepToConsCorr < -0.35) {
                                                                    coachMessages.push({
                                                                        section: 'Ciclo Identificado',
                                                                        icon: '😴',
                                                                        text: `Descobri um padrão claro: dormir menos horas está fortemente ligado a mais consumo no mesmo dia (${sleepToConsCorr.toFixed(2)}). O sono é a tua primeira linha de defesa. Prioriza 7-8h todas as noites - não é luxo, é estratégia.`,
                                                                        tone: 'insight'
                                                                    });
                                                                }

                                                                // Consumo → Sono
                                                                if (consToSleepCorr !== null && consToSleepCorr < -0.35) {
                                                                    coachMessages.push({
                                                                        section: 'Impacto no Sono',
                                                                        icon: '🌙',
                                                                        text: `Mais consumo está a prejudicar diretamente o teu sono (${consToSleepCorr.toFixed(2)}). É um círculo vicioso: consumo → menos sono → mais consumo. Para quebrar isto, começa por reduzir quantidade/frequência e vê o sono melhorar.`,
                                                                        tone: 'alert'
                                                                    });
                                                                }

                                                                // Consumo → Humor dia seguinte
                                                                if (consToNextMoodCorr !== null && consToNextMoodCorr < -0.35) {
                                                                    coachMessages.push({
                                                                        section: 'Preço Emocional',
                                                                        icon: '📉',
                                                                        text: `O que consomes hoje cobra o seu preço AMANHÃ (${consToNextMoodCorr.toFixed(2)}). Dias de consumo alto resultam em humor baixo no dia seguinte. Quando planeias consumir, planeia também autocuidado extra para o dia seguinte.`,
                                                                        tone: 'care'
                                                                    });
                                                                }

                                                                // Humor → Consumo
                                                                if (moodToConsCorr !== null && moodToConsCorr < -0.35) {
                                                                    coachMessages.push({
                                                                        section: 'Uso Emocional',
                                                                        icon: '💔',
                                                                        text: `Pior humor leva-te a consumir mais (${moodToConsCorr.toFixed(2)}). Estás a usar NEP como estratégia para lidar com emoções difíceis. Isto é importante de reconhecer! Cria alternativas: caminhada, música, falar com alguém. Tens opções.`,
                                                                        tone: 'empowerment'
                                                                    });
                                                                }

                                                                // Hora último consumo → Sono
                                                                if (lastHourToSleepCorr !== null && lastHourToSleepCorr < -0.35) {
                                                                    coachMessages.push({
                                                                        section: 'Timing Crítico',
                                                                        icon: '🕐',
                                                                        text: `Consumir tarde (próximo da hora de deitar) prejudica significativamente o teu sono (${lastHourToSleepCorr.toFixed(2)}). Tenta criar uma "janela de paragem" - para de consumir pelo menos 3-4h antes de deitar. O teu sono vai agradecer.`,
                                                                        tone: 'strategy'
                                                                    });
                                                                }

                                                                // 4. EMOÇÕES DE RISCO E PROTEÇÃO
                                                                if (emotionalPatterns && emotionalPatterns.totalEmotionsTracked > 0) {
                                                                    if (emotionalPatterns.riskEmotions.length > 0 && emotionalPatterns.protectiveEmotions.length > 0) {
                                                                        const topRisk = emotionalPatterns.riskEmotions[0].emotion;
                                                                        const topProtective = emotionalPatterns.protectiveEmotions[0].emotion;

                                                                        coachMessages.push({
                                                                            section: 'O Teu Mapa Emocional',
                                                                            icon: '🗺️',
                                                                            text: `Identificaste os teus gatilhos e as tuas forças: "${topRisk}" está associado a maior risco, enquanto "${topProtective}" funciona como proteção. Usa este conhecimento a teu favor - quando sentires ${topRisk}, tenta fazer algo que te traga ${topProtective}.`,
                                                                            tone: 'empowerment'
                                                                        });
                                                                    } else if (emotionalPatterns.riskEmotions.length > 0) {
                                                                        const topRisk = emotionalPatterns.riskEmotions[0].emotion;
                                                                        coachMessages.push({
                                                                            section: 'Alerta de Gatilho',
                                                                            icon: '⚠️',
                                                                            text: `"${topRisk}" é uma emoção de alto risco para ti. Quando a sentires, essa é a hora de usar as tuas técnicas DBT, não de consumir. Prepara um plano para esses momentos.`,
                                                                            tone: 'alert'
                                                                        });
                                                                    }
                                                                }

                                                                // 4.5. VARIAÇÃO INTRA-DIA (Como te sentes ao longo do dia)
                                                                if (intraDayVariation && intraDayVariation.totalDays > 0) {
                                                                    const avgMood = intraDayVariation.avgMoodChange;
                                                                    const avgEnergy = intraDayVariation.avgEnergyChange;
                                                                    const improving = intraDayVariation.improvingDays;
                                                                    const declining = intraDayVariation.decliningDays;

                                                                    if (avgMood !== null && avgMood > 1.5) {
                                                                        coachMessages.push({
                                                                            section: 'Padrão Positivo',
                                                                            icon: '🌅',
                                                                            text: `Em ${improving} de ${intraDayVariation.totalDays} dias com múltiplos registos, o teu humor melhorou ao longo do dia (média +${avgMood.toFixed(1)} pontos). Isto é EXCELENTE! Significa que tens estratégias que funcionam durante o dia. Identifica o que fazes que ajuda.`,
                                                                            tone: 'celebration'
                                                                        });
                                                                    } else if (avgMood !== null && avgMood < -1.5) {
                                                                        coachMessages.push({
                                                                            section: 'Padrão a Observar',
                                                                            icon: '📉',
                                                                            text: `O teu humor tende a piorar ao longo do dia (média ${avgMood.toFixed(1)} pontos em ${intraDayVariation.totalDays} dias). Isto pode indicar fadiga acumulada ou consumo que piora o estado. Considera pausas, descanso e técnicas DBT ao longo do dia.`,
                                                                            tone: 'care'
                                                                        });
                                                                    }

                                                                    if (avgEnergy !== null && avgEnergy > 1.5) {
                                                                        coachMessages.push({
                                                                            section: 'Energia Crescente',
                                                                            icon: '⚡',
                                                                            text: `Boa notícia: a tua energia geralmente aumenta ao longo do dia (+${avgEnergy.toFixed(1)} pontos). Isto sugere que acordas devagar mas vais ganhando força. Aproveita os períodos de maior energia para tarefas importantes.`,
                                                                            tone: 'encouragement'
                                                                        });
                                                                    } else if (avgEnergy !== null && avgEnergy < -1.5) {
                                                                        coachMessages.push({
                                                                            section: 'Gestão de Energia',
                                                                            icon: '🔋',
                                                                            text: `A tua energia tende a diminuir ao longo do dia (${avgEnergy.toFixed(1)} pontos). Normal até certo ponto, mas se for muito acentuado pode indicar falta de pausas, má alimentação ou impacto do consumo. Experimenta micro-pausas de 5min a cada 2h.`,
                                                                            tone: 'strategy'
                                                                        });
                                                                    }
                                                                }

                                                                // 5. PADRÃO DE CONSUMO GERAL
                                                                const last7Days = consumptions.filter(c => {
                                                                    const date = new Date(c.timestamp);
                                                                    const daysDiff = (Date.now() - date.getTime()) / (1000 * 60 * 60 * 24);
                                                                    return daysDiff <= 7;
                                                                });

                                                                const last14Days = consumptions.filter(c => {
                                                                    const date = new Date(c.timestamp);
                                                                    const daysDiff = (Date.now() - date.getTime()) / (1000 * 60 * 60 * 24);
                                                                    return daysDiff > 7 && daysDiff <= 14;
                                                                });

                                                                if (last7Days.length > 0 && last14Days.length > 0) {
                                                                    const avgLast7 = last7Days.length / 7;
                                                                    const avgLast14 = last14Days.length / 7;
                                                                    const change = ((avgLast7 - avgLast14) / avgLast14) * 100;

                                                                    if (change < -15) {
                                                                        coachMessages.push({
                                                                            section: 'Tendência',
                                                                            icon: '📉',
                                                                            text: `Nos últimos 7 dias, reduziste ${Math.abs(change).toFixed(0)}% em relação à semana anterior. Isto é ENORME! O que funcionou? Identifica e repete essas estratégias.`,
                                                                            tone: 'celebration'
                                                                        });
                                                                    } else if (change > 15) {
                                                                        coachMessages.push({
                                                                            section: 'Tendência',
                                                                            icon: '📈',
                                                                            text: `O consumo aumentou ${change.toFixed(0)}% na última semana comparado à anterior. Sem julgamento - só dados. O que mudou? Stress? Menos sono? Identifica o trigger e ajusta o plano.`,
                                                                            tone: 'reflection'
                                                                        });
                                                                    } else {
                                                                        coachMessages.push({
                                                                            section: 'Consistência',
                                                                            icon: '📊',
                                                                            text: `O teu padrão tem-se mantido estável nas últimas semanas. Estabilidade é o primeiro passo antes da redução. Bom trabalho em manter o controlo.`,
                                                                            tone: 'acknowledgment'
                                                                        });
                                                                    }
                                                                }

                                                                // 6. MENSAGEM FINAL DE ENCORAJAMENTO
                                                                if (consumptions.length > 10 || reflections.length > 5 || wellbeingLogs.length > 5) {
                                                                    coachMessages.push({
                                                                        section: 'Compromisso',
                                                                        icon: '✨',
                                                                        text: `O simples facto de estares aqui, a registar, a refletir, a analisar - isso já é mudança. Redução de danos não é perfeição, é progresso. E tu estás a progredir, um dia de cada vez.`,
                                                                        tone: 'inspiration'
                                                                    });
                                                                }

                                                                // Se não há dados suficientes
                                                                if (coachMessages.length === 0) {
                                                                    coachMessages.push({
                                                                        section: 'Começo',
                                                                        icon: '🌱',
                                                                        text: `Estás no início da tua jornada de autoconhecimento. Cada registo que fazes é uma semente plantada. Continua - em breve vais começar a ver os padrões e isso vai-te dar poder para mudar.`,
                                                                        tone: 'encouragement'
                                                                    });
                                                                }

                                                                return coachMessages.map((msg, i) => (
                                                                    <div key={i} className={(darkMode ? 'bg-gray-800/60 border-gray-600/50' : 'bg-white/80 border-gray-200') + ' rounded-lg p-5 border-2'}>

                                                                            <div className="text-3xl flex-shrink-0 mt-1">{msg.icon}</div>
                                                                            <div className="flex-1">
                                                                                <div className={'font-bold text-lg mb-2 ' + (
                                                                                    msg.tone === 'celebration' ? (darkMode ? 'text-green-400' : 'text-green-700') :
                                                                                    msg.tone === 'insight' ? (darkMode ? 'text-blue-400' : 'text-blue-700') :
                                                                                    msg.tone === 'care' ? (darkMode ? 'text-pink-400' : 'text-pink-700') :
                                                                                    msg.tone === 'alert' ? (darkMode ? 'text-orange-400' : 'text-orange-700') :
                                                                                    (darkMode ? 'text-purple-400' : 'text-purple-700')
                                                                                )}>{msg.section}</div>
                                                                                <div className={'leading-relaxed ' + (darkMode ? 'text-gray-200' : 'text-gray-800')}>{msg.text}</div>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                ));
                                                            })()}

                                                            {/* Call to Action */}
                                                            <div className={(darkMode ? 'bg-gradient-to-r from-purple-800/50 to-pink-800/50 border-purple-500/50' : 'bg-gradient-to-r from-purple-200/50 to-pink-200/50 border-purple-400') + ' rounded-lg p-6 border-2 text-center'}>
                                                                <div className="text-3xl mb-3">💪</div>
                                                                <div className={'font-bold text-lg mb-2 ' + (darkMode ? 'text-white' : 'text-gray-900')}>Tu tens o controlo</div>
                                                                <div className={'text-sm leading-relaxed ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>
                                                                    Estes dados são teus. Este progresso é teu. Este poder de escolha é teu.
                                                                    Continua a usar esta app, continua a refletir, continua a crescer. 🚀
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* Sentiment Analysis */}
                                                    {sentimentAnalysis && (
                                                        <div className={(darkMode ? 'bg-gradient-to-r from-purple-900/30 to-pink-900/30 border-purple-700/50' : 'bg-gradient-to-r from-purple-50 to-pink-50 border-purple-200') + ' rounded-xl p-6 border'}>
                                                            <h3 className={'font-semibold mb-4 flex items-center gap-2 ' + (darkMode ? 'text-white' : 'text-gray-800')}>
                                                                <span className="text-xl">💭</span>
                                                                Análise de Sentimento nas Reflexões
                                                            </h3>
                                                            <div className="space-y-4">
                                                                <div className="grid grid-cols-2 gap-4">
                                                                    <div className={(darkMode ? 'bg-purple-900/50 border-purple-700/50' : 'bg-purple-100 border-purple-200') + ' rounded-lg p-4 border'}>
                                                                        <div className={'text-xs mb-1 ' + (darkMode ? 'text-gray-300' : 'text-gray-600')}>Dias com Consumo Elevado</div>
                                                                        <div className={'text-2xl font-bold ' + (darkMode ? 'text-purple-300' : 'text-purple-700')}>
                                                                            {sentimentAnalysis.avgSentimentHighConsumption > 0 ? '😊' : sentimentAnalysis.avgSentimentHighConsumption < -0.5 ? '😔' : '😐'}
                                                                            <span className="text-lg ml-2">
                                                                                {sentimentAnalysis.avgSentimentHighConsumption > 0 ? 'Positivo' : sentimentAnalysis.avgSentimentHighConsumption < -0.5 ? 'Negativo' : 'Neutro'}

                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.water} onChange={(e) => setWellbeingForm({...wellbeingForm, water: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ''}>💧 Bebi água suficiente</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.rest} onChange={(e) => setWellbeingForm({...wellbeingForm, rest: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ''}>😴 Descansei o suficiente</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.social} onChange={(e) => setWellbeingForm({...wellbeingForm, social: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ''}>👥 Tive contacto social</span>
                                                </label>
                                                <label className="flex items-center space-x-2 cursor-pointer">
                                                    <input type="checkbox" checked={wellbeingForm.food} onChange={(e) => setWellbeingForm({...wellbeingForm, food: e.target.checked})} className="rounded text-blue-600 focus:ring-blue-500" />
                                                    <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ''}>🍽️ Comi refeições nutritivas</span>
                                                </label>
                                            </div>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium mb-2 ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>Emoções do dia (opcional)</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {['😊 Feliz', '😢 Triste', '😰 Ansioso/a', '😌 Calmo/a', '😤 Irritado/a', '💪 Motivado/a', '😴 Cansado/a', '🙏 Grato/a', '😫 Frustrado/a', '🌟 Esperançoso/a', '😐 Entediado/a', '😓 Stressado/a', '💯 Confiante', '😔 Inseguro/a', '🥺 Solitário/a', '🥰 Amado/a', '🎉 Entusiasmado/a', '😕 Confuso/a', '🌱 Orgulhoso/a', '😖 Culpado/a', '😞 Envergonhado/a', '🤗 Vulnerável', '⚡ Empoderado/a', '😣 Arrependido/a', '😊 Satisfeito/a', '🌫️ Desconectado/a', '🔥 Com craving', '✨ Resiliente', '🌈 Otimista', '😩 Overwhelmed', '🤝 Apoiado/a', '🧘 Em paz'].map(emotion => (
                                                    <label key={emotion} className="flex items-center space-x-2 cursor-pointer">
                                                        <input type="checkbox" checked={wellbeingForm.emotions.includes(emotion)} onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setWellbeingForm({...wellbeingForm, emotions: [...wellbeingForm.emotions, emotion]});
                                                            } else {
                                                                setWellbeingForm({...wellbeingForm, emotions: wellbeingForm.emotions.filter(em => em !== emotion)});
                                                            }
                                                        }} className="rounded text-purple-600 focus:ring-purple-500" />
                                                        <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>{emotion}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>Notas (opcional)</label>
                                            <textarea value={wellbeingForm.notes} onChange={(e) => setWellbeingForm({...wellbeingForm, notes: e.target.value})} className={(darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300') + ' w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-400 h-20'} placeholder="Como te sentes hoje?"></textarea>
                                        </div>
                                        <button onClick={submitWellbeing} className="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white py-3 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showReflectionModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowReflectionModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className={'text-xl font-bold ' + (darkMode ? 'text-white' : 'text-gray-800')}>Reflexão DBT</h3>
                                        <button onClick={() => setShowReflectionModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-purple-50 rounded-lg p-4 border border-purple-200">
                                            <p className="text-purple-900 font-medium">{currentDbtQuestion}</p>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>A tua reflexão</label>
                                            <textarea value={reflectionAnswer} onChange={(e) => setReflectionAnswer(e.target.value)} className={(darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300') + ' w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400 h-32'} placeholder="Escreve os teus pensamentos..."></textarea>
                                        </div>
                                        <button onClick={submitReflection} className="w-full bg-gradient-to-r from-purple-500 to-indigo-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-indigo-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showCycleModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowCycleModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className={'text-xl font-bold ' + (darkMode ? 'text-white' : 'text-gray-800')}>🌙 Novo Ciclo</h3>
                                        <button onClick={() => setShowCycleModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <p className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-600') + ''}>Marcar um novo ciclo muda a frase motivacional e a reflexão diária.</p>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>Hora a que te deitaste</label>
                                            <input type="time" value={cycleForm.bedtime} onChange={(e) => setCycleForm({...cycleForm, bedtime: e.target.value})} className={(darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300') + ' w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400'} />
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-2'}>Gatilhos identificados</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                {['Stress', 'Ansiedade', 'Solidão', 'Festa', 'Trabalho', 'Família', 'Hábito', 'Tristeza', 'Dependência', 'Tédio', 'Cansaço', 'Dor física', 'Insónia', 'Conflito', 'Celebração'].map(trigger => (
                                                    <label key={trigger} className="flex items-center space-x-2 cursor-pointer">
                                                        <input type="checkbox" checked={cycleForm.triggers.includes(trigger)} onChange={(e) => {
                                                            if (e.target.checked) {
                                                                setCycleForm({...cycleForm, triggers: [...cycleForm.triggers, trigger]});
                                                            } else {
                                                                setCycleForm({...cycleForm, triggers: cycleForm.triggers.filter(t => t !== trigger)});
                                                            }
                                                        }} className="rounded text-indigo-600 focus:ring-indigo-500" />
                                                        <span className={'text-sm ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ''}>{trigger}</span>
                                                    </label>
                                                ))}
                                            </div>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium mb-1 ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>Notas sobre este ciclo (opcional)</label>
                                            <textarea value={cycleForm.notes} onChange={(e) => setCycleForm({...cycleForm, notes: e.target.value})} className={(darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300') + ' w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-400 h-20'} placeholder="Como foi o ciclo? O que observaste?"></textarea>
                                        </div>
                                        <div className={(darkMode ? 'bg-green-900/20 border-green-700/50' : 'bg-green-50 border-green-200') + ' rounded-lg p-3 border'}>
                                            <label className="flex items-center space-x-2 cursor-pointer">
                                                <input type="checkbox" checked={cycleForm.lastBefore00} onChange={(e) => setCycleForm({...cycleForm, lastBefore00: e.target.checked})} className="rounded text-green-600 focus:ring-green-500 w-5 h-5" />
                                                <span className={'text-sm font-medium ' + (darkMode ? 'text-green-300' : 'text-green-800')}>✓ Último consumo do ciclo foi antes da meia-noite (00h)</span>
                                            </label>
                                        </div>
                                        <button onClick={submitCycle} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white py-3 rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-all font-medium">Iniciar Novo Ciclo</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showGoalModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowGoalModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className={'text-xl font-bold ' + (darkMode ? 'text-white' : 'text-gray-800')}>{editingGoal ? 'Editar Meta' : 'Nova Meta'}</h3>
                                        <button onClick={() => { setShowGoalModal(false); setEditingGoal(null); }} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>Tipo de Meta</label>
                                            <select value={goalForm.type} onChange={(e) => setGoalForm({...goalForm, type: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400">
                                                <option value="reduce_frequency">Reduzir Frequência</option>
                                                <option value="reduce_quantity">Reduzir Quantidade (mg)</option>
                                                <option value="delay_first">Adiar Primeiro Consumo</option>
                                                <option value="increase_interval">Aumentar Intervalo (horas)</option>
                                                <option value="limit_last">Hora do Último Consumo</option>
                                                <option value="sleep_hours">Horas de Sono por Dia</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>Período</label>
                                            <select value={goalForm.period} onChange={(e) => setGoalForm({...goalForm, period: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400">
                                                <option value="daily">Diário</option>
                                                <option value="weekly">Semanal</option>
                                                <option value="monthly">Mensal</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>
                                                Meta {goalForm.type.includes('delay') || goalForm.type.includes('limit') ? '(HH:MM)' : '(número)'}
                                            </label>
                                            <input type={goalForm.type.includes('delay') || goalForm.type.includes('limit') ? 'time' : 'number'} value={goalForm.target} onChange={(e) => setGoalForm({...goalForm, target: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium ' + (darkMode ? 'text-gray-300' : 'text-gray-700') + ' mb-1'}>Prazo</label>
                                            <input type="date" value={goalForm.deadline} onChange={(e) => setGoalForm({...goalForm, deadline: e.target.value})} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />
                                        </div>
                                        <button onClick={submitGoal} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all font-medium">{editingGoal ? 'Atualizar Meta' : 'Criar Meta'}</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {showEditConsumptionModal && editingConsumption && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50" onClick={() => setShowEditConsumptionModal(false)}>
                                <div className="bg-white rounded-2xl p-6 max-w-md w-full" onClick={(e) => e.stopPropagation()}>
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className={'text-xl font-bold ' + (darkMode ? 'text-white' : 'text-gray-800')}>Editar Consumo</h3>
                                        <button onClick={() => setShowEditConsumptionModal(false)} className="text-gray-400 hover:text-gray-600"><X /></button>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className={'block text-sm font-medium mb-1 ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>Data</label>
                                                <input
                                                    type="date"
                                                    value={editingConsumption.timestamp.split('T')[0]}
                                                    onChange={(e) => {
                                                        const currentDate = new Date(editingConsumption.timestamp);
                                                        const newDate = new Date(e.target.value);
                                                        newDate.setHours(currentDate.getHours(), currentDate.getMinutes(), 0, 0);
                                                        setEditingConsumption({...editingConsumption, timestamp: newDate.toISOString(), date: e.target.value});
                                                    }}
                                                    className={(darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300') + ' w-full p-2 border rounded-lg focus:ring-2 focus:ring-purple-400'}
                                                />
                                            </div>
                                            <div>
                                                <label className={'block text-sm font-medium mb-1 ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>Hora</label>
                                                <input
                                                    type="time"
                                                    value={new Date(editingConsumption.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}
                                                    onChange={(e) => {
                                                        const currentDate = new Date(editingConsumption.timestamp);
                                                        const [hours, minutes] = e.target.value.split(':');
                                                        currentDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);
                                                        setEditingConsumption({...editingConsumption, timestamp: currentDate.toISOString()});
                                                    }}
                                                    className={(darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300') + ' w-full p-2 border rounded-lg focus:ring-2 focus:ring-purple-400'}
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className={'block text-sm font-medium mb-1 ' + (darkMode ? 'text-gray-300' : 'text-gray-700')}>Notas</label>
                                            <textarea value={editingConsumption.notes || ''} onChange={(e) => setEditingConsumption({...editingConsumption, notes: e.target.value})} className={(darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300') + ' w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400 h-24'} placeholder="Adiciona notas sobre este consumo..."></textarea>
                                        </div>
                                        <button onClick={saveEditedConsumption} className="w-full bg-gradient-to-r from-blue-500 to-cyan-500 text-white py-3 rounded-lg hover:from-blue-600 hover:to-cyan-600 transition-all font-medium">Guardar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className={(darkMode ? 'bg-gray-800' : 'bg-white') + ' fixed bottom-0 left-0 right-0 shadow-xl rounded-t-3xl p-4'}>
                            <div className="max-w-2xl mx-auto">
                                <div className="grid grid-cols-5 gap-1">
                                    <button onClick={() => setCurrentView('home')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'home' ? 'bg-purple-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'))}>
                                        <Heart className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Início</div>
                                    </button>
                                    <button onClick={() => setCurrentView('patterns')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'patterns' ? 'bg-purple-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'))}>
                                        <BarChart3 className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Padrões</div>
                                    </button>
                                    <button onClick={() => setCurrentView('history')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'history' ? 'bg-purple-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'))}>
                                        <BookOpen className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Histórico</div>
                                    </button>
                                    <button onClick={() => setCurrentView('goals')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'goals' ? 'bg-purple-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'))}>
                                        <Target className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Metas</div>
                                    </button>
                                    <button onClick={() => setCurrentView('resources')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'resources' ? 'bg-purple-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'))}>
                                        <TrendingDown className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Recursos</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Toast Notifications */}
                    <div className="fixed bottom-20 left-0 right-0 flex flex-col items-center gap-2 px-4 pointer-events-none z-50">
                        {toasts.map(toast => (
                            <div key={toast.id} className={'px-4 py-3 rounded-lg shadow-lg font-medium text-sm pointer-events-auto transform transition-all ' + (toast.type === 'success' ? 'bg-green-500 text-white' : toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white')}>
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HarmReductionTracker />);
    </script>
</body>
</html>
