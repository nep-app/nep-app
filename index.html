    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

                if (window.firebaseReady) { resolve(); } 
                else { window.addEventListener('firebase-ready', resolve, { once: true }); }

        const firebaseConfig = {
            apiKey: "AIzaSyDH8-OZZQPHzWOnkcABi0tWbeFpxSrnc0w",
            authDomain: "harm-reduction-d4f7d.firebaseapp.com",
            projectId: "harm-reduction-d4f7d",
            storageBucket: "harm-reduction-d4f7d.firebasestorage.app",
            messagingSenderId: "732077932839",

        const dbtQuestions = ["O que funcionou bem para ti hoje em termos de autocuidado?", "Quando sentiste um impulso forte, que estratégia usaste (ou poderias ter usado)?", "Que emoções notaste antes de consumir? E depois?", "O que te ajudaria a sentir-te mais seguro/a nos próximos dias?", "Olhando para hoje, que pequena mudança farias amanhã?", "Quais foram os teus gatilhos hoje? Como poderias preparar-te para eles?", "Que necessidade estavas a tentar satisfazer com o consumo?", "Se um amigo teu estivesse na mesma situação, que lhe dirias?", "O que te traz alegria ou paz, além do consumo?", "Como podes ser gentil contigo mesmo/a amanhã?"];

        const reflectiveQuestions = ["Redução de danos não é sobre perfeição, é sobre cuidar de ti mesmo/a. Como te podes cuidar hoje?", "Cada pequena escolha consciente é uma vitória. Que escolha consciente fizeste hoje?", "O teu corpo merece respeito, independentemente das tuas escolhas. Como o podes honrar hoje?", "Não há recaídas, há aprendizagens. O que aprendeste sobre ti recentemente?", "A mudança acontece em pequenos passos, não em saltos gigantes. Que pequeno passo deste esta semana?"];

        const copingStrategies = {'Stress': ['Respiração 4-7-8: inspira 4s, segura 7s, expira 8s', 'Caminhada rápida de 10 minutos'], 'Ansiedade': ['Técnica 5-4-3-2-1', 'Alongamentos lentos'], 'Solidão': ['Enviar mensagem a um amigo', 'Ir a um espaço público'], 'Festa': ['Preparar um plano de redução de riscos', 'Levar água e snacks'], 'Trabalho': ['Fazer pausas de 5min a cada hora', 'Lista de prioridades'], 'Família': ['Estabelecer limites claros', 'Comunicar necessidades com calma'], 'Hábito': ['Quebrar a rotina', 'Técnica dos 15 minutos'], 'Tristeza': ['Permitir chorar sem julgamento', 'Escrever o que sentes'], 'Dependência': ['Reconhecer sem vergonha', 'Ligar para linha de apoio (1414)']};

        const educationalResources = [{title: "O que é Redução de Danos?", content: "RD é um conjunto de estratégias práticas para minimizar riscos do uso de drogas, sem exigir abstinência."}, {title: "Hidratação & Descanso", content: "Estimulantes desidratam. Bebe água regularmente. O sono é essencial para recuperação."}, {title: "Intervalo entre Consumos", content: "Espaçar reduz tolerância e danos ao corpo. Idealmente >2h entre doses."}, {title: "Testagem de Substâncias", content: "Sempre que possível, testa antes de consumir. CheckIn (Lisboa), MAPS (Porto)."}, {title: "Sinais de Alerta", content: "Dor no peito, confusão, temperatura alta = emergência (112)."}, {title: "Tolerância & Pausas", content: "O corpo adapta-se. Pausas ajudam a reduzir tolerância."}];

        const getTodayKey = () => new Date().toISOString().split('T')[0];
        const genId = () => crypto.randomUUID();

        // Icons (simplified SVG components)
        const Clock = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>);
        const Heart = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>);
        const Brain = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/></svg>);
        const Trash2 = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>);
        const Edit2 = ({ className = "w-4 h-4" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>);
        const Check = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>);
        const X = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>);
        const BarChart3 = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>);
        const BookOpen = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>);
        const TrendingDown = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>);
        const LogOut = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>);
        const Moon = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>);
        const Sun = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>);
        const Download = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>);
        const Target = ({ className = "w-5 h-5" }) => (<svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>);

        function HarmReductionTracker() {
            const [firebaseInitialized, setFirebaseInitialized] = useState(false);
            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [user, setUser] = useState(null);
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [currentView, setCurrentView] = useState('home');
            const [consumptions, setConsumptions] = useState([]);
            const [dailyLogs, setDailyLogs] = useState([]);
            const [wellbeingLogs, setWellbeingLogs] = useState([]);
            const [reflections, setReflections] = useState([]);
            const [cycles, setCycles] = useState([]);
            const [goals, setGoals] = useState([]);
            const [darkMode, setDarkMode] = useState(false);
            const [timeFilter, setTimeFilter] = useState('all');
            const [currentCycleId, setCurrentCycleId] = useState(null);

            // ALTERAÇÃO 5: Sistema de ciclos para controlar mudança de frase/reflexão
            const getCurrentCycleIndex = () => {
                if (cycles.length === 0) return 0;
                return cycles.length - 1;
            };

            const currentDbtQuestion = useMemo(() => {
                const cycleIndex = getCurrentCycleIndex();
                return dbtQuestions[cycleIndex % dbtQuestions.length];
            }, [cycles.length]);

            const currentReflection = useMemo(() => {
                const cycleIndex = getCurrentCycleIndex();
                return reflectiveQuestions[cycleIndex % reflectiveQuestions.length];
            }, [cycles.length]);

            useEffect(() => { const saved = localStorage.getItem('darkMode') === 'true'; setDarkMode(saved); if (saved) document.body.classList.add('dark'); }, []);

            useEffect(() => { waitForFirebase().then(() => { const { initializeApp, getFirestore, getAuth, enableIndexedDbPersistence } = window.firebaseModules; const app = initializeApp(firebaseConfig); const dbInstance = getFirestore(app); const authInstance = getAuth(app); enableIndexedDbPersistence(dbInstance).catch(() => {}); setDb(dbInstance); setAuth(authInstance); setFirebaseInitialized(true); }); }, []);

            useEffect(() => { if (!auth) return; const { onAuthStateChanged } = window.firebaseModules; onAuthStateChanged(auth, (user) => { setUser(user); }); }, [auth]);

            useEffect(() => { if (!user || !db) return; const { collection, onSnapshot } = window.firebaseModules; const unsubs = [onSnapshot(collection(db, `users/${user.uid}/consumptions`), snap => setConsumptions(snap.docs.map(d => d.data()).sort((a,b) => b.timestamp.localeCompare(a.timestamp)))), onSnapshot(collection(db, `users/${user.uid}/dailyLogs`), snap => setDailyLogs(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/wellbeingLogs`), snap => setWellbeingLogs(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/reflections`), snap => setReflections(snap.docs.map(d => d.data()).sort((a,b) => b.date.localeCompare(a.date)))), onSnapshot(collection(db, `users/${user.uid}/cycles`), snap => setCycles(snap.docs.map(d => d.data()).sort((a,b) => b.timestamp.localeCompare(a.timestamp)))), onSnapshot(collection(db, `users/${user.uid}/goals`), snap => setGoals(snap.docs.map(d => d.data())))]; return () => unsubs.forEach(u => u()); }, [user, db]);

            const toggleDarkMode = () => { const newMode = !darkMode; setDarkMode(newMode); localStorage.setItem('darkMode', newMode); document.body.classList.toggle('dark', newMode); };

            const handleAuth = async (e) => { e.preventDefault(); setAuthError(''); if (!auth) return; const { signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.firebaseModules; try { if (isLogin) await signInWithEmailAndPassword(auth, email, password); else await createUserWithEmailAndPassword(auth, email, password); } catch (error) { if (error.code === 'auth/user-not-found') setAuthError('Email não encontrado. Cria conta primeiro.'); else if (error.code === 'auth/wrong-password') setAuthError('Password errada.'); else if (error.code === 'auth/email-already-in-use') setAuthError('Email já existe. Faz login.'); else if (error.code === 'auth/weak-password') setAuthError('Password fraca (mínimo 6 caracteres).'); else if (error.code === 'auth/invalid-email') setAuthError('Email inválido.'); else if (error.code === 'auth/invalid-credential') setAuthError('Email ou password incorretos.'); else setAuthError('Erro: ' + error.message); } };

            const handleLogout = () => { const { signOut } = window.firebaseModules; signOut(auth); };

            const saveToFirebase = async (collectionName, entry) => { if (!user || !db) return; const { doc, setDoc, collection } = window.firebaseModules; await setDoc(doc(db, `users/${user.uid}/${collectionName}`, entry.id), entry); };

            const markConsumption = async () => { const now = new Date(); const item = { id: genId(), timestamp: now.toISOString(), date: getTodayKey(), notes: '' }; setConsumptions(prev => [item, ...prev]); await saveToFirebase('consumptions', item); };

            const deleteItem = async (collectionName, id) => { if (!user || !db) return; const { doc, deleteDoc } = window.firebaseModules; try { await deleteDoc(doc(db, `users/${user.uid}/${collectionName}`, id)); } catch (error) { console.error('Erro ao apagar:', error); } };

            // ALTERAÇÃO 1: Média de intervalos (últimos 20 consumos)
            const getIntervalStats = () => {
                if (consumptions.length < 2) return null;
                const sorted = [...consumptions].sort((a,b) => a.timestamp.localeCompare(b.timestamp));
                const last20 = sorted.slice(-20);
                const intervals = [];
                for (let i = 1; i < last20.length; i++) {
                    const diff = (new Date(last20[i].timestamp) - new Date(last20[i-1].timestamp)) / (1000 * 60 * 60);
                    intervals.push({ hours: diff, date: last20[i].date, timestamp: last20[i].timestamp });
                }
                const avgHours = intervals.reduce((sum, i) => sum + i.hours, 0) / intervals.length;
                const shortIntervals = intervals.filter(i => i.hours < 2);
                const shortByDay = {};
                shortIntervals.forEach(i => { shortByDay[i.date] = (shortByDay[i.date] || 0) + 1; });
                return { avgHours: avgHours.toFixed(1), intervals: intervals.slice(-10).reverse(), shortIntervals: shortIntervals.length, shortByDay };
            };

            const getTimeSinceLastConsumption = () => { if (consumptions.length === 0) return null; const last = new Date(consumptions[0].timestamp); const now = new Date(); const diffMs = now - last; const hours = Math.floor(diffMs / (1000 * 60 * 60)); const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60)); return { hours, minutes, total: diffMs }; };

            const getTodayConsumptions = () => consumptions.filter(c => c.date === getTodayKey());

            const getLast7Days = () => { const logs = dailyLogs.slice(0, 7); if (logs.length === 0) return { avgTimes: 0, avgMg: 0 }; return { avgTimes: (logs.reduce((sum, l) => sum + l.times, 0) / logs.length).toFixed(1), avgMg: (logs.reduce((sum, l) => sum + l.mg, 0) / logs.length).toFixed(0) }; };

            const exportToCSV = () => { const headers = ['Data', 'Hora', 'Tipo', 'Detalhes']; const rows = [...consumptions.map(c => [new Date(c.timestamp).toLocaleDateString('pt-PT'), new Date(c.timestamp).toLocaleTimeString('pt-PT'), 'Consumo', c.notes || '']), ...dailyLogs.map(l => [l.date, '', 'Dosagem', l.times + 'x, ' + l.mg + 'mg' + (l.notes ? ', ' + l.notes : '')]), ...wellbeingLogs.map(w => [w.date, '', 'Bem-estar', 'Sono: ' + w.sleep + '/10, Humor: ' + w.mood + '/10'])]; const csv = [headers, ...rows].map(row => row.map(cell => '"' + cell + '"').join(',')).join('\n'); const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'reducao-danos-' + getTodayKey() + '.csv'; a.click(); };

            // ALTERAÇÃO 2 e 7: Corrigir progresso de metas + adicionar meta "hora do último consumo"
            const getGoalProgress = (goal) => {
                if (goal.type === 'reduce_frequency') {
                    const avgLast7 = parseFloat(getLast7Days().avgTimes);
                    if (avgLast7 === 0) return 0;
                    if (avgLast7 <= goal.target) return 100;
                    const baseline = Math.max(avgLast7, goal.target * 2);
                    const progress = ((baseline - avgLast7) / (baseline - goal.target)) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                if (goal.type === 'reduce_quantity') {
                    const avgLast7Mg = parseFloat(getLast7Days().avgMg);
                    if (avgLast7Mg === 0) return 0;
                    if (avgLast7Mg <= goal.target) return 100;
                    const baseline = Math.max(avgLast7Mg, goal.target * 2);
                    const progress = ((baseline - avgLast7Mg) / (baseline - goal.target)) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                if (goal.type === 'delay_first') {
                    const recentConsumptions = consumptions.slice(0, 21);
                    if (recentConsumptions.length === 0) return 0;
                    const firstOfDays = {};
                    recentConsumptions.forEach(c => { if (!firstOfDays[c.date] || c.timestamp < firstOfDays[c.date]) { firstOfDays[c.date] = c.timestamp; } });
                    const targetParts = goal.target.split(':');
                    const targetMinutes = parseInt(targetParts[0]) * 60 + parseInt(targetParts[1]);
                    let successDays = 0;
                    Object.values(firstOfDays).forEach(timestamp => { const d = new Date(timestamp); const firstMinutes = d.getHours() * 60 + d.getMinutes(); if (firstMinutes >= targetMinutes) successDays++; });
                    return Math.min(100, (successDays / Object.keys(firstOfDays).length) * 100);
                }
                
                if (goal.type === 'increase_interval') {
                    const intervalStats = getIntervalStats();
                    if (!intervalStats) return 0;
                    const avg = parseFloat(intervalStats.avgHours);
                    if (avg >= goal.target) return 100;
                    const progress = (avg / goal.target) * 100;
                    return Math.max(0, Math.min(100, progress));
                }
                
                // ALTERAÇÃO 7: Nova meta "Hora do último consumo diário"
                if (goal.type === 'limit_last') {
                    const recentConsumptions = consumptions.slice(0, 21);
                    if (recentConsumptions.length === 0) return 0;
                    const lastOfDays = {};
                    recentConsumptions.forEach(c => { if (!lastOfDays[c.date] || c.timestamp > lastOfDays[c.date]) { lastOfDays[c.date] = c.timestamp; } });
                    const targetParts = goal.target.split(':');
                    const targetMinutes = parseInt(targetParts[0]) * 60 + parseInt(targetParts[1]);
                    let successDays = 0;
                    Object.values(lastOfDays).forEach(timestamp => { const d = new Date(timestamp); const lastMinutes = d.getHours() * 60 + d.getMinutes(); if (lastMinutes <= targetMinutes) successDays++; });
                    return Math.min(100, (successDays / Object.keys(lastOfDays).length) * 100);
                }
                
                return 0;
            };

            const intervalStats = getIntervalStats();
            const todayCount = getTodayConsumptions().length;
            const last7 = getLast7Days();

            // Render
            if (!firebaseInitialized) return (<div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center p-4"><div className="text-purple-600 text-xl">A carregar... 🔄</div></div>);

            // ALTERAÇÃO 3: Título do login "NEP app"
            if (!user) return (<div className="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 flex items-center justify-center p-4"><div className="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full"><h1 className="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mb-2">NEP app</h1><p className="text-gray-600 mb-6">Sincroniza entre dispositivos 💜</p><form onSubmit={handleAuth} className="space-y-4"><input type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required /><input type="password" placeholder="Password (mínimo 6 caracteres)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-purple-400" required />{authError && (<div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm">{authError}</div>)}<button type="submit" className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-3 rounded-lg hover:from-purple-600 hover:to-pink-600 transition-all font-medium">{isLogin ? 'Entrar' : 'Criar Conta'}</button><button type="button" onClick={() => setIsLogin(!isLogin)} className="w-full text-purple-600 text-sm hover:underline">{isLogin ? 'Criar conta nova' : 'Já tenho conta'}</button></form><p className="text-xs text-gray-500 mt-6">💡 Usa o mesmo email e password no PC e telemóvel para sincronizar</p></div></div>);

            return (
                <div className={'min-h-screen ' + (darkMode ? 'dark bg-gray-900' : 'bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50') + ' p-4 transition-colors pb-24'}>
                    <div className="max-w-2xl mx-auto">
                        <div className="bg-white rounded-3xl shadow-xl p-6 mb-6">
                            <div className="flex justify-between items-start">
                                <div>
                                    <h1 className="text-3xl font-bold mb-2">
                                        <span className="font-bold text-purple-600">N</span><span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600">otas de </span>
                                        <span className="font-bold text-pink-600">E</span><span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600">xperiências e </span>
                                        <span className="font-bold text-blue-600">P</span><span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600">adrões</span>
                                    </h1>
                                    <p className="text-gray-600 text-sm">
                                        <span className="font-bold text-purple-600">N</span>ote it. <span className="font-bold text-pink-600">E</span>xplore it. <span className="font-bold text-blue-600">P</span>lan it. <span className="font-bold text-purple-600">N</span>ão <span className="font-bold text-pink-600">E</span>stás <span className="font-bold text-blue-600">P</span>erdida.
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={toggleDarkMode} className="text-gray-400 hover:text-gray-600 p-2" title={darkMode ? "Modo claro" : "Modo escuro"}>{darkMode ? <Sun /> : <Moon />}</button>
                                    <button onClick={exportToCSV} className="text-gray-400 hover:text-gray-600 p-2" title="Exportar dados"><Download /></button>
                                    <button onClick={handleLogout} className="text-gray-400 hover:text-gray-600 p-2" title="Sair"><LogOut /></button>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl shadow-xl p-6 mb-6">
                            {currentView === 'home' && (
                                <div className="space-y-6">
                                    <div className="bg-gradient-to-br from-purple-50 to-pink-50 rounded-2xl p-6 border border-purple-200">
                                        <div className="flex items-start gap-3 mb-3"><Brain /><p className="text-purple-900 font-medium leading-relaxed">{currentReflection}</p></div>
                                    </div>

                                    <button onClick={markConsumption} className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-2xl p-8 text-xl font-semibold hover:from-purple-600 hover:to-pink-600 transition-all shadow-lg hover:shadow-xl flex flex-col items-center"><Clock /><div className="mt-2">Marcar Consumo Agora</div></button>

                                    <button onClick={async () => { const now = new Date(); const item = { id: genId(), timestamp: now.toISOString(), mood: 5, sleep: 'bem', triggers: [], notes: '' }; setCycles(prev => [item, ...prev]); await saveToFirebase('cycles', item); }} className="w-full bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-2xl p-6 text-lg font-semibold hover:from-indigo-600 hover:to-purple-600 transition-all shadow-lg hover:shadow-xl">🌙 Novo Ciclo</button>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-white rounded-xl p-4 border border-gray-200"><div className="text-gray-600 text-sm mb-1">Hoje</div><div className="text-3xl font-bold text-purple-600">{todayCount}x</div></div>
                                        <div className="bg-white rounded-xl p-4 border border-gray-200"><div className="text-gray-600 text-sm mb-1">Média 7 dias</div><div className="text-3xl font-bold text-pink-600">{last7.avgTimes}x</div><div className="text-sm text-gray-500">{last7.avgMg}mg/dia</div></div>
                                    </div>

                                    {(() => { const timeSince = getTimeSinceLastConsumption(); if (timeSince && consumptions.length > 0) return (<div className="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-xl p-3 border border-blue-200"><div className="flex items-center justify-between"><span className="text-sm text-blue-700">Último consumo</span><span className="text-lg font-bold text-blue-900">{timeSince.hours > 0 ? timeSince.hours + 'h ' : ''}{timeSince.minutes}min</span></div></div>); return null; })()}
                                </div>
                            )}
                            {currentView === 'patterns' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Padrões</h2>

                                    <div className="flex gap-2 overflow-x-auto pb-2">
                                        {['today', 'week', 'month', 'all'].map(filter => (
                                            <button key={filter} onClick={() => setTimeFilter(filter)} className={'px-4 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ' + (timeFilter === filter ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                                {filter === 'today' && 'Hoje'}
                                                {filter === 'week' && 'Esta Semana'}
                                                {filter === 'month' && 'Este Mês'}
                                                {filter === 'all' && 'Tudo'}
                                            </button>
                                        ))}
                                    </div>

                                    {(() => {
                                        const now = new Date();
                                        let startDate;
                                        if (timeFilter === 'today') startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                        else if (timeFilter === 'week') { startDate = new Date(now); startDate.setDate(now.getDate() - 7); }
                                        else if (timeFilter === 'month') { startDate = new Date(now); startDate.setDate(now.getDate() - 30); }
                                        else startDate = new Date(0);

                                        const filteredConsumptions = consumptions.filter(c => new Date(c.timestamp) >= startDate);

                                        if (filteredConsumptions.length < 2) return (<div className="bg-white rounded-xl p-6 border border-gray-200 text-center text-gray-500">Sem dados suficientes para análise de padrões neste período</div>);

                                        const sorted = [...filteredConsumptions].sort((a,b) => a.timestamp.localeCompare(b.timestamp));
                                        const intervals = [];
                                        for (let i = 1; i < sorted.length; i++) {
                                            const diff = (new Date(sorted[i].timestamp) - new Date(sorted[i-1].timestamp)) / (1000 * 60 * 60);
                                            intervals.push({ hours: diff, date: sorted[i].date, timestamp: sorted[i].timestamp });
                                        }
                                        const avgHours = intervals.reduce((sum, i) => sum + i.hours, 0) / intervals.length;
                                        const shortIntervals = intervals.filter(i => i.hours < 2);
                                        const shortByDay = {};
                                        shortIntervals.forEach(i => { shortByDay[i.date] = (shortByDay[i.date] || 0) + 1; });

                                        return (
                                            <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                <h3 className="font-semibold text-gray-800 mb-4">⏱️ Análise de Intervalos</h3>
                                                <div className="bg-purple-50 rounded-lg p-4 mb-4">
                                                    <div className="text-center">
                                                        <div className="text-4xl font-bold text-purple-600">{avgHours.toFixed(1)}h</div>
                                                        <div className="text-sm text-gray-600 mt-1">Média entre consumos</div>
                                                    </div>
                                                </div>
                                                <div className="mb-4">
                                                    <div className="flex justify-between items-center mb-2">
                                                        <span className="text-sm font-medium text-gray-700">Intervalos curtos (&lt;2h):</span>
                                                        <span className="text-sm font-bold text-orange-600">{shortIntervals.length}</span>
                                                    </div>
                                                    {Object.keys(shortByDay).length > 0 && (
                                                        <div className="text-xs text-gray-600 mt-2">
                                                            <strong>Por dia:</strong>
                                                            {Object.entries(shortByDay).map(([date, count]) => (
                                                                <div key={date} className="flex justify-between py-1">
                                                                    <span>{new Date(date).toLocaleDateString('pt-PT')}</span>
                                                                    <span className="font-medium text-orange-600">{count}x</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                                <div>
                                                    <h4 className="text-sm font-medium text-gray-700 mb-2">Últimos 10 intervalos:</h4>
                                                    <div className="space-y-1">
                                                        {intervals.slice(-10).reverse().map((interval, i) => (
                                                            <div key={i} className="flex justify-between text-sm py-1 border-b border-gray-100">
                                                                <span className="text-gray-600">{new Date(interval.timestamp).toLocaleDateString('pt-PT')} {new Date(interval.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</span>
                                                                <span className={'font-medium ' + (interval.hours < 2 ? 'text-orange-600' : 'text-green-600')}>{interval.hours.toFixed(1)}h</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}
                            {currentView === 'history' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Histórico</h2>

                                    <div className="flex gap-2 overflow-x-auto pb-2">
                                        {['today', 'week', 'month', 'all'].map(filter => (
                                            <button key={filter} onClick={() => setTimeFilter(filter)} className={'px-4 py-2 rounded-lg font-medium transition-colors whitespace-nowrap ' + (timeFilter === filter ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                                {filter === 'today' && 'Hoje'}
                                                {filter === 'week' && 'Esta Semana'}
                                                {filter === 'month' && 'Este Mês'}
                                                {filter === 'all' && 'Tudo'}
                                            </button>
                                        ))}
                                    </div>

                                    {(() => {
                                        const now = new Date();
                                        let startDate;
                                        if (timeFilter === 'today') startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                                        else if (timeFilter === 'week') { startDate = new Date(now); startDate.setDate(now.getDate() - 7); }
                                        else if (timeFilter === 'month') { startDate = new Date(now); startDate.setDate(now.getDate() - 30); }
                                        else startDate = new Date(0);

                                        const filteredReflections = reflections.filter(r => new Date(r.timestamp || r.date) >= startDate);
                                        const filteredWellbeing = wellbeingLogs.filter(w => new Date(w.timestamp || w.date) >= startDate);
                                        const filteredDailyLogs = dailyLogs.filter(l => new Date(l.timestamp || l.date) >= startDate);
                                        const filteredConsumptions = consumptions.filter(c => new Date(c.timestamp) >= startDate);

                                        const hasData = filteredReflections.length > 0 || filteredWellbeing.length > 0 || filteredDailyLogs.length > 0 || filteredConsumptions.length > 0;

                                        if (!hasData) return (<div className="bg-white rounded-xl p-6 border border-gray-200 text-center text-gray-500">Sem registos neste período</div>);

                                        return (
                                            <div className="space-y-6">
                                                {filteredReflections.length > 0 && (
                                                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2"><Brain className="text-purple-600" /> Reflexões DBT ({filteredReflections.length})</h3>
                                                        <div className="space-y-4">
                                                            {filteredReflections.map(r => (
                                                                <div key={r.id} className="border-l-4 border-purple-400 pl-4 py-2 bg-purple-50 rounded-r-lg">
                                                                    <div className="flex justify-between items-start mb-1">
                                                                        <div className="text-xs text-gray-500">{new Date(r.timestamp || r.date).toLocaleDateString('pt-PT')} {r.timestamp && new Date(r.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</div>
                                                                        <button onClick={() => deleteItem('reflections', r.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-3 h-3" /></button>
                                                                    </div>
                                                                    <div className="text-sm text-purple-700 font-medium mb-1">{r.question}</div>
                                                                    <div className="text-gray-700 text-sm">{r.answer}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {filteredWellbeing.length > 0 && (
                                                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2"><Heart className="text-blue-600" /> Bem-Estar ({filteredWellbeing.length})</h3>
                                                        <div className="space-y-3">
                                                            {filteredWellbeing.map(w => (
                                                                <div key={w.id} className="p-3 bg-blue-50 rounded-lg border border-blue-200">
                                                                    <div className="flex justify-between items-center mb-2">
                                                                        <div className="text-sm font-medium text-gray-800">{new Date(w.timestamp || w.date).toLocaleDateString('pt-PT')}</div>
                                                                        <button onClick={() => deleteItem('wellbeingLogs', w.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-3 h-3" /></button>
                                                                    </div>
                                                                    <div className="grid grid-cols-3 gap-2 text-sm">
                                                                        <div className="text-center">
                                                                            <div className="text-xs text-gray-600">Sono</div>
                                                                            <div className="text-lg font-bold text-blue-600">{w.sleep}/10</div>
                                                                        </div>
                                                                        <div className="text-center">
                                                                            <div className="text-xs text-gray-600">Humor</div>
                                                                            <div className="text-lg font-bold text-blue-600">{w.mood}/10</div>
                                                                        </div>
                                                                        <div className="text-center">
                                                                            <div className="text-xs text-gray-600">Energia</div>
                                                                            <div className="text-lg font-bold text-blue-600">{w.energy || '-'}/10</div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {filteredDailyLogs.length > 0 && (
                                                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2">📊 Registos Diários ({filteredDailyLogs.length})</h3>
                                                        <div className="space-y-3">
                                                            {filteredDailyLogs.map(l => (
                                                                <div key={l.id} className="p-3 bg-pink-50 rounded-lg border border-pink-200">
                                                                    <div className="flex justify-between items-center mb-2">
                                                                        <div className="text-sm font-medium text-gray-800">{new Date(l.timestamp || l.date).toLocaleDateString('pt-PT')}</div>
                                                                        <button onClick={() => deleteItem('dailyLogs', l.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-3 h-3" /></button>
                                                                    </div>
                                                                    <div className="flex gap-4 text-sm">
                                                                        <div>
                                                                            <span className="text-gray-600">Frequência: </span>
                                                                            <span className="font-bold text-pink-600">{l.times}x</span>
                                                                        </div>
                                                                        <div>
                                                                            <span className="text-gray-600">Quantidade: </span>
                                                                            <span className="font-bold text-pink-600">{l.mg}mg</span>
                                                                        </div>
                                                                    </div>
                                                                    {l.notes && <div className="text-sm text-gray-600 mt-2 italic">💭 {l.notes}</div>}
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}

                                                {filteredConsumptions.length > 0 && (
                                                    <div className="bg-white rounded-xl p-6 border border-gray-200">
                                                        <h3 className="font-semibold text-gray-800 mb-4 flex items-center gap-2"><Clock className="text-purple-600" /> Consumos ({filteredConsumptions.length})</h3>
                                                        <div className="space-y-3">
                                                            {filteredConsumptions.map(c => (
                                                                <div key={c.id} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                                                    <div className="flex justify-between items-center">
                                                                        <div>
                                                                            <div className="font-medium text-gray-800">{new Date(c.timestamp).toLocaleDateString('pt-PT')} - {new Date(c.timestamp).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'})}</div>
                                                                            {c.notes && <div className="text-sm text-gray-600 mt-1">💭 {c.notes}</div>}
                                                                        </div>
                                                                        <button onClick={() => deleteItem('consumptions', c.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-4 h-4" /></button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}
                            {currentView === 'goals' && (
                                <div className="space-y-6">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-2xl font-bold text-gray-800">Metas</h2>
                                        <button onClick={async () => { const goalType = prompt('Tipo: reduce_frequency, reduce_quantity, delay_first, increase_interval, limit_last'); const target = prompt('Meta (número ou hora HH:MM)'); const deadline = prompt('Prazo (YYYY-MM-DD)'); if (goalType && target && deadline) { const item = { id: genId(), type: goalType, target: goalType.includes('delay') || goalType.includes('limit') ? target : parseFloat(target), deadline, createdAt: new Date().toISOString(), completed: false }; setGoals(prev => [...prev, item]); await saveToFirebase('goals', item); } }} className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors text-sm font-medium">+ Nova Meta</button>
                                    </div>

                                    {goals.length === 0 ? (
                                        <div className="text-center py-8 text-gray-500"><Target className="w-12 h-12 mx-auto mb-3 text-gray-400" /><p>Ainda não tens metas definidas</p></div>
                                    ) : (
                                        <div className="space-y-4">
                                            {goals.map(goal => (
                                                <div key={goal.id} className="bg-white rounded-xl p-4 border border-gray-200">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div>
                                                            <h3 className="font-semibold text-gray-800">
                                                                {goal.type === 'reduce_frequency' && 'Reduzir Frequência'}
                                                                {goal.type === 'reduce_quantity' && 'Reduzir Quantidade'}
                                                                {goal.type === 'delay_first' && 'Adiar Primeiro Consumo'}
                                                                {goal.type === 'increase_interval' && 'Aumentar Intervalo'}
                                                                {goal.type === 'limit_last' && 'Hora do Último Consumo'}
                                                            </h3>
                                                            <p className="text-sm text-gray-600">
                                                                Meta: {goal.type === 'reduce_frequency' && goal.target + 'x/dia'}
                                                                {goal.type === 'reduce_quantity' && goal.target + 'mg/dia'}
                                                                {goal.type === 'delay_first' && 'após ' + goal.target}
                                                                {goal.type === 'increase_interval' && goal.target + 'h entre consumos'}
                                                                {goal.type === 'limit_last' && 'antes de ' + goal.target}
                                                            </p>
                                                            <p className="text-sm text-gray-500">Até: {new Date(goal.deadline).toLocaleDateString('pt-PT')}</p>
                                                        </div>
                                                        <button onClick={() => deleteItem('goals', goal.id)} className="text-red-600 hover:text-red-700"><Trash2 className="w-4 h-4" /></button>
                                                    </div>
                                                    <div className="mt-3">
                                                        <div className="flex justify-between text-sm mb-1">
                                                            <span className="text-gray-600">Progresso</span>
                                                            <span className="font-medium text-purple-600">{getGoalProgress(goal).toFixed(0)}%</span>
                                                        </div>
                                                        <div className="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                                                            <div className="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all" style={{ width: getGoalProgress(goal) + '%' }} />
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {currentView === 'resources' && (
                                <div className="space-y-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Recursos</h2>
                                    <div className="bg-red-50 rounded-xl p-6 border border-red-200"><h3 className="font-semibold text-red-800 mb-3">🚨 Emergência</h3><div className="space-y-2 text-red-700"><p><strong>INEM:</strong> 112</p><p><strong>Linha Vida:</strong> 1414</p></div></div>
                                    <div className="bg-white rounded-xl p-6 border border-gray-200"><h3 className="font-semibold text-gray-800 mb-3">📞 Linhas de Apoio</h3><div className="space-y-2 text-gray-700"><p><strong>SOS Droga:</strong> 1414 (24h)</p><p><strong>SNS 24:</strong> 808 24 24 24</p></div></div>
                                    {educationalResources.map((resource, i) => (
                                        <div key={i} className="bg-purple-50 rounded-xl p-4 border border-purple-200"><h4 className="font-medium text-purple-800 mb-2">{resource.title}</h4><p className="text-sm text-purple-700">{resource.content}</p></div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="fixed bottom-0 left-0 right-0 bg-white shadow-xl rounded-t-3xl p-4">
                            <div className="max-w-2xl mx-auto">
                                <div className="grid grid-cols-5 gap-1">
                                    <button onClick={() => setCurrentView('home')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'home' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <Heart className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Início</div>
                                    </button>
                                    <button onClick={() => setCurrentView('patterns')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'patterns' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <BarChart3 className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Padrões</div>
                                    </button>
                                    <button onClick={() => setCurrentView('history')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'history' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <BookOpen className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Histórico</div>
                                    </button>
                                    <button onClick={() => setCurrentView('goals')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'goals' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <Target className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Metas</div>
                                    </button>
                                    <button onClick={() => setCurrentView('resources')} className={'p-2 rounded-xl transition-colors flex flex-col items-center ' + (currentView === 'resources' ? 'bg-purple-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200')}>
                                        <TrendingDown className="w-5 h-5" />
                                        <div className="text-xs font-medium mt-1">Recursos</div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HarmReductionTracker />);
    </script>
</body>
</html>
