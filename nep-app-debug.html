<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>NEP app - Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 20px; font-family: monospace; }
        .log { padding: 5px; border-bottom: 1px solid #ddd; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔍 NEP App - Modo Debug</h1>
    <div id="logs"></div>
    <div id="root"></div>
    
    <script>
        const log = (msg, type = 'info') => {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
            document.getElementById('logs').appendChild(div);
            console.log(msg);
        };
        
        log('✅ Página carregada', 'success');
        
        // Testa se type="module" funciona
        try {
            log('📦 A carregar React...', 'info');
        } catch (e) {
            log('❌ Erro ao carregar: ' + e.message, 'error');
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" 
            onload="log('✅ React carregado', 'success')" 
            onerror="log('❌ Erro ao carregar React', 'error')"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" 
            onload="log('✅ ReactDOM carregado', 'success')" 
            onerror="log('❌ Erro ao carregar ReactDOM', 'error')"></script>
    
    <script>
        window.addEventListener('load', () => {
            log('✅ Todos os scripts carregados', 'success');
            log('📱 A tentar renderizar app...', 'info');
            
            try {
                const { useState } = React;
                
                function TestApp() {
                    const [count, setCount] = useState(0);
                    
                    return React.createElement('div', { 
                        style: { padding: '20px', background: '#f0f0f0', marginTop: '20px' }
                    }, [
                        React.createElement('h2', { key: '1' }, '✅ App React Funciona!'),
                        React.createElement('p', { key: '2' }, 'Contador: ' + count),
                        React.createElement('button', { 
                            key: '3',
                            onClick: () => setCount(count + 1),
                            style: { padding: '10px 20px', fontSize: '16px', cursor: 'pointer' }
                        }, 'Clica aqui!')
                    ]);
                }
                
                const root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(React.createElement(TestApp));
                log('✅ App renderizada com sucesso!', 'success');
                
            } catch (e) {
                log('❌ ERRO ao renderizar: ' + e.message, 'error');
                log('Stack: ' + e.stack, 'error');
            }
        });
    </script>
</body>
</html>
