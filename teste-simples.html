<!DOCTYPE html>
<html>
<head>
    <title>Teste NEP</title>
</head>
<body>
    <h1>Teste de Carregamento</h1>
    <div id="status">A carregar...</div>
    <div id="root"></div>
    
    <script>
        document.getElementById('status').innerHTML = 'JavaScript funciona! ✅';
        
        // Testa se consegue carregar React
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/react@18/umd/react.production.min.js';
        script.onload = () => {
            document.getElementById('status').innerHTML += '<br>React carregou! ✅';
        };
        script.onerror = () => {
            document.getElementById('status').innerHTML += '<br>❌ Sem internet! A app precisa de internet para funcionar.';
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
